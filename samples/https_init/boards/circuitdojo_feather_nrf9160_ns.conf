# Beyond ../../common/boards/nrf91.conf.

# What this build reports as its running firmware; bump it with each release.
CONFIG_PIGEON_FOTA_CURRENT_VERSION="0.1.0"
# The nRF Connect SDK dfu_target backend, which the modem and MCUboot
# integration are built around.
CONFIG_PIGEON_FOTA_NCS=y

# Image upload over the console UART (newtmgr -c serial) as a FOTA fallback.
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Modem trace on uart1 (see the overlay); the backend choice only applies
# once the trace subsystem itself is on.
CONFIG_NRF_MODEM_LIB_TRACE=y
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_UART=y
CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
