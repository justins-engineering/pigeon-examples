# native_sim has no real nRF91 cellular modem, so it can't use the
# modem-offloaded TLS/socket path (CONFIG_MODEM_KEY_MGMT, real hardware
# only -- see connection_manager.c's provision_cert()). This falls through
# to tls_credential_add() automatically (that #ifdef already exists), but
# needs the full software mbedTLS/PSA stack this base prj.conf never had to
# carry before, since real hardware's TLS happens inside the modem, not on
# this MCU. Reuses the same TLS/PSA fixes wifi_init's native_sim/real-
# ESP32-C6 board work needs against this same backend (SNI, mbedTLS heap
# wiring, ECDHE key generation, TLS1.2 PRF, ...) -- see that sample's
# prj.conf for the full root-cause writeup of each one.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=131072
# This file builds under this workspace's default vanilla-Zephyr manifest
# (west-vanilla.yml), same as coap_tcp_init/coap_dtls_init/wifi_init's
# native_sim confs -- there's no separate native_sim topdir on the NCS
# manifest. CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN is the symbol vanilla
# Kconfig actually defines; the split CONFIG_MBEDTLS_SSL_IN/OUT_CONTENT_LEN
# pair is nrf_security-only and doesn't even apply to this sample's own NCS
# hardware target -- real nRF91 TLS is modem-offloaded
# (see prj.conf's CONFIG_MODEM_KEY_MGMT note), never touching this
# software mbedTLS stack at all.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y

CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
# Unlike wifi_init (which trims its CA bundle to just the leaf cert
# specifically to avoid this want), https_init's cert/GTS_Root_R4.crt is
# Google's full 2-cert bundle including the legacy RSA cross-sign -- this
# is required for mbedtls_x509_crt_parse() to recognize that cert's
# signature-algorithm OID at all (see wifi_init/src/net/
# wifi_connection_manager.c's comment for the full mechanism), simplest
# fix here since this sample's cert file is otherwise real-hardware-
# verified and shouldn't be edited for a native_sim-only concern.
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# Default (1) exhausted immediately in practice: this sample's
# CONFIG_PIGEON_LOG_UPLOAD tries to open its own TLS socket for a log-chunk
# POST while the shadow-fetch socket from the same poll cycle is still
# active, failing the second allocation with ENOMEM ("Failed to allocate
# TLS context").
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="1.1.1.1"
CONFIG_DNS_SERVER2="8.8.8.8"
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=64

# FOTA is meaningless on native_sim: disabling sysbuild's MCUboot image for
# this board (see the -DSB_CONFIG_BOOTLOADER_NONE=y build-time flag this
# sample's README documents for native_sim -- nrfxlib's crypto build
# otherwise hard-asserts trying to build MCUboot for a SoC it's never heard
# of) leaves no bootloader/second slot for pigeon_fota.c to schedule a
# test-swap into. CONFIG_PIGEON_FOTA_CURRENT_VERSION and CONFIG_FAULT_DUMP
# (ARM-only) both moved out of prj.conf into
# boards/circuitdojo_feather_nrf9160_ns.conf for the same reason: an
# assigned-but-dependency-unsatisfied value is a fatal Kconfig warning
# under this workspace's build, not just a silent no-op.
CONFIG_PIGEON_FOTA=n
CONFIG_PIGEON_FOTA_NCS=n

# MCUboot/MCUmgr-over-UART DFU (prj.conf) only makes sense with a real
# bootloader -- this build disables sysbuild's MCUboot image entirely (see
# -DSB_CONFIG_BOOTLOADER_NONE=y above), so every one of these would
# otherwise be an assigned-but-unsatisfied-dependency Kconfig warning
# (fatal): CONFIG_UART_MCUMGR in particular unconditionally selects
# UART_INTERRUPT_DRIVEN, which native_sim's own console driver doesn't
# satisfy, on top of the plain MCUMGR/BOOTLOADER dependency chain.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_MCUBOOT_BOOTUTIL_LIB=n
CONFIG_MCUMGR=n
CONFIG_UART_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_UART=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n
CONFIG_IMG_MANAGER=n
CONFIG_IMG_ERASE_PROGRESSIVELY=n
CONFIG_IMG_ENABLE_IMAGE_CHECK=n

# Native Simulator offloaded sockets (NSOS) -- no net-setup.sh/root/TAP/NAT
# host setup needed, see coap_tcp_init/wifi_init's native_sim board confs
# for the full rationale; CONNECTIVITY_SIM is what lets
# connection_manager.c's generic conn_mgr_all_if_up()/_connect() calls
# (shared with coap_tcp_init, already native_sim-clean) actually reach
# NET_EVENT_L4_CONNECTED.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y
