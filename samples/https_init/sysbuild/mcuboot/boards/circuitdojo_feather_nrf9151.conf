# Core registers are cleaned before TF-M starts.
CONFIG_MCUBOOT_CLEANUP_ARM_CORE=y
# The board's PMIC driver is compiled in from the devicetree and needs work
# queues and mutexes.
CONFIG_MULTITHREADING=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y

# Serial recovery over uart0 (newtmgr -c serial).
CONFIG_SERIAL=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=450
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=1000
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# Serial recovery owns uart0, so the console goes to RTT. With minimal
# logging it is the printk target that matters, not a log backend.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# Blocks rather than drops when the buffer fills, so a viewer attached after
# the fact still sees the whole boot.
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y
CONFIG_LOG=y

# nRF Connect SDK symbols; the ESP32-C6 build has no definition for them.
CONFIG_FPROTECT=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0
CONFIG_NCS_BOOT_BANNER=n
CONFIG_SPEED_OPTIMIZATIONS=y

# No led0 alias on this board; its only LEDs are behind the PMIC.
CONFIG_MCUBOOT_INDICATION_LED=n
