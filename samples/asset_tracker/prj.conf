# GNSS position reported as telemetry over the HTTPS connector, with the
# recovery options an unattended device needs. The endpoint and token belong
# in the git-ignored prj.local.conf.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_HTTPS=y

# Seven position keys, uptime and the boot's reset cause, plus a spare. Past
# the store's size a key is refused rather than queued, and the whole cycle is
# meant to ride one report.
CONFIG_PIGEON_TELEMETRY_MAX_KEYS=10

# Nobody is standing next to the asset: a fatal error reboots rather than
# halting, and the watchdog covers a liveness stall that raises none.
CONFIG_PIGEON_REBOOT_ON_FATAL=y
CONFIG_PIGEON_WATCHDOG=y

CONFIG_PICOLIBC=y
# The position is reported as decimal strings, so %f has to print.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_STD_C17=y
CONFIG_MISRA_SANE=y
# Reset cause, reported as telemetry on the first poll after boot.
CONFIG_HWINFO=y
CONFIG_SIZE_OPTIMIZATIONS=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Logging from the connection manager's event callbacks overflows the default.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
# Lets the shadow's "log" field silence and restore logging at runtime.
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_NET_LOG=y
