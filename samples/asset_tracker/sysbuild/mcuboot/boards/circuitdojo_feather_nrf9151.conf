# Core registers are cleaned before TF-M starts.
CONFIG_MCUBOOT_CLEANUP_ARM_CORE=y
# The board's PMIC driver is compiled in from the devicetree and needs work
# queues and mutexes.
CONFIG_MULTITHREADING=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y

# nRF Connect SDK symbols.
CONFIG_FPROTECT=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0
CONFIG_NCS_BOOT_BANNER=n
CONFIG_SPEED_OPTIMIZATIONS=y

# No led0 alias on this board; its only LEDs are behind the PMIC.
CONFIG_MCUBOOT_INDICATION_LED=n
