# Board-specific config for the Circuit Dojo nRF9160 Feather (/ns variant).
# Mirrors https_init's board conf of the same name (minus the modem-trace
# UART bits this sample doesn't use -- see the overlay), with one addition:
# RTT console/log backend instead of UART. This board's UART TX pin is
# proven dead at the bench-wiring level (TX->CP2102N never reaches the
# host), but SWD/J-Link works fine, so route all console+log output over
# RTT instead -- full log visibility with zero UART dependency. Same
# CONFIG_USE_SEGGER_RTT/CONFIG_LOG_BACKEND_RTT this repo's own
# embedded-departure-board sibling project already uses for its MCUboot
# sub-image on this exact board.

# Allow writing to the (internal) flash at runtime. Kept even without
# MCUmgr/FOTA in this sample -- see the 9151 board conf's identical note.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Align the max FD entry to NRF_MODEM_MAX_SOCKET_COUNT(8)
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_POLL_MAX=8

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Connection Manager and Connectivity layer
CONFIG_NRF_MODEM_LIB_NET_IF=y

# AT Host
CONFIG_UART_INTERRUPT_DRIVEN=y

# Modem key management -- see the 9151 board conf's identical note: nRF91
# TLS sockets are offloaded to the modem regardless of this board, so this
# must be y for connection_manager.c's provision_cert() to actually reach
# the modem's own credential store.
CONFIG_MODEM_KEY_MGMT=y

# GNSS antenna/LNA coexistence config (found the hard way -- real hardware
# read gps_sats=0 indefinitely, antenna attached, until this was added).
# Nordic's modem_antenna library (nrf/lib/modem_antenna/Kconfig) only
# defaults this on for Nordic's own DK/Thingy91 boards -- this board isn't
# in that allowlist, so nothing issues the LNA-gating AT command unless an
# app explicitly opts in. Circuit Dojo's own reference GPS sample
# (circuitdojo/nrf9160-feather-examples-and-drivers, samples/gps board
# confs) sets exactly this value for the 9160/9151/9161 Feather family, and
# it matches Nordic's own MODEM_ANTENNA_GNSS_ONBOARD default -- this
# board's GNSS antenna path needs the same LNA-gating window as the
# reference DK boards, just not auto-configured for a non-Nordic board. No
# XMAGPIO needed -- Circuit Dojo's own sample doesn't set one for this
# board family either, implying the antenna switch here isn't MAGPIO-driven.
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586"

# TF-M configurations
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# UART configuration (common) -- still needed by the modem/AT-host path
# (nRF91 modem UART framing, unrelated to this board's console), just not
# used as the console/log sink anymore (see RTT below).
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# RTT console + log backend, replacing UART console on this board (see this
# file's header comment for why). CONFIG_CONSOLE stays on (RTT_CONSOLE
# depends on it) -- only the backing driver moves off UART.
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
# Non-blocking: an app that's actually out doing its job (unlike MCUboot's
# brief recovery-window run) must never stall waiting for a debugger to
# attach and start reading the RTT buffer.
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_TRIM=y
