# Board-specific config for the Circuit Dojo nRF9151 Feather (/ns variant).
# Mirrors https_init's board conf of the same name, minus what that file
# needed only for MCUboot/FOTA/modem-trace, which this sample doesn't use
# (no sysbuild here -- see this sample's README for why).

# Allow writing to the (internal) flash at runtime. Kept even without
# MCUmgr/FOTA in this sample: CONFIG_SETTINGS (pulled in transitively by
# some netowrking/TLS subsystems) can otherwise trip the same MPU fault this
# option exists to avoid on this board.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Align the max FD entry to NRF_MODEM_MAX_SOCKET_COUNT(8)
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_POLL_MAX=8

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Connection Manager and Connectivity layer
CONFIG_NRF_MODEM_LIB_NET_IF=y

# AT Host
CONFIG_UART_INTERRUPT_DRIVEN=y

# Modem key management
# Must be y: nRF91 TLS sockets are offloaded to the modem, which does its own
# TLS handshake using certs provisioned to ITS OWN credential store via AT
# commands (modem_key_mgmt), not Zephyr's tls_credentials/mbedTLS subsystem.
# With this =n, connection_manager.c's provision_cert() fell through to
# tls_credential_add(), which the offloaded socket implementation never
# consults -- so the modem had no CA cert at the sec_tag and any outbound TLS
# connection (e.g. the pigeon HTTPS shadow fetch) would fail the handshake.
# Same gotcha https_init's board conf documents.
CONFIG_MODEM_KEY_MGMT=y

# GNSS antenna/LNA coexistence config -- see the 9160 board conf's identical
# note for the full evidence trail (Circuit Dojo's own reference GPS sample
# sets this exact value across the 9160/9151/9161 Feather family; Nordic's
# own modem_antenna library doesn't default it on for non-Nordic boards).
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586"

# TF-M configurations
# This board DOES have a partition overlay (boards/circuitdojo_feather_nrf9151_ns.overlay,
# same slot0 secure/nonsecure rebalance https_init's overlay does) -- unlike
# https_init this sample's overlay isn't for a second MCUboot slot (this
# sample now uses sysbuild/MCUboot too, see prj.conf's comment on why), just
# to fit HTTPS+TLS+cellular+GNSS+logging in the stock 192 KB nonsecure split.
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# UART configuration (common) -- console/shell only; no modem trace UART
# (uart1) here, so unlike https_init's board conf there's nothing to enable
# via a devicetree overlay for that purpose.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
