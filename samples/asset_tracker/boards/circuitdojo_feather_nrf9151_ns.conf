# Beyond ../../common/boards/nrf91.conf.

# GPS has to be in the modem's system mode for it to interleave satellite
# search with LTE reception rather than one excluding the other.
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y

# Power saving mode asks the network for longer idle windows, which is the
# time GNSS gets to search in. The parameters nRF's own GNSS sample requests.
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
CONFIG_LTE_PSM_REQ_RAT="00000011"

# Nordic's antenna library gates the GNSS low-noise amplifier only for its own
# boards; without this command the receiver tracks no satellites here.
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586"
