# What mbedTLS needs for a pre-shared key. Merged for the boards whose TLS runs
# in mbedTLS; a modem keeps the key in its own store.
#
# Deliberately without a CONFIG_MBEDTLS_CIPHERSUITE_* pin: with no explicit
# list mbedTLS offers every suite these wants allow, which is how
# TLS_PSK_WITH_AES_128_CCM_8 gets offered at all (this tree has no per-suite
# Kconfig for it).
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# The key is imported into PSA as a derive key run through the TLS 1.2 PRF;
# without every want below the handshake fails before a byte leaves the device.
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
