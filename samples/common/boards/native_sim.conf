# native_sim: host sockets through NSOS, TLS in mbedTLS.

# Offloaded host sockets need no TAP interface or root; the connectivity
# simulator gives the connection manager an interface to drive.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y

# Duplicate address detection is not implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# The default is 1, so a second concurrent TLS socket fails with -107.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
# 64-bit host structures need more than a device does.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=131072
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
