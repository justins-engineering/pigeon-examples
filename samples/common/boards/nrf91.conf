# Circuit Dojo nRF91 Feathers: the modem owns LTE, TLS and the credential store.

# Modem library behind Zephyr's connection manager; pulls in lte_lc.
CONFIG_NRF_MODEM_LIB_NET_IF=y
# Interface-down must leave the AT channel alive for the CFUN=0 in
# net_disconnect(); the default shuts the modem library down first.
CONFIG_NRF_MODEM_LIB_NET_IF_DOWN_DEFAULT_LTE_DISCONNECT=y

# TLS sockets are offloaded to the modem, which only sees credentials written
# with modem_key_mgmt, never tls_credential_add.
CONFIG_MODEM_KEY_MGMT=y

# One descriptor per modem socket (NRF_MODEM_MAX_SOCKET_COUNT).
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_POLL_MAX=8

# Duplicate address detection is not implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# AT commands over the console UART.
CONFIG_AT_HOST_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Non-secure application image beside TF-M.
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# Settings and MCUboot image management write internal flash at runtime.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PM_DEVICE=y
CONFIG_FAULT_DUMP=2
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Pigeon"
