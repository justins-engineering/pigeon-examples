# ESP32-C6-DevKitC: WiFi station on Zephyr's IP stack, TLS in mbedTLS.

CONFIG_WIFI=y
# The SSID must be a non-empty string at build time; the real values belong in the
# sample's boards/esp32c6_devkitc_hpcore.local.conf.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_TYPE_PSK=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="changeme"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="changeme"
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048

CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
# Two resolver slots plus a socket still closing exhaust the default four
# connection contexts within one poll cycle.
CONFIG_NET_MAX_CONN=8

# A resolver taken from the DHCP offer can fail reconfiguration and take the
# whole offer down with it.
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="1.1.1.1"
CONFIG_DNS_SERVER2="8.8.8.8"
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=64

CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
# mbedTLS allocates from this buffer, never the kernel heap. Sized for two
# concurrent X.509 sessions; a 16 KiB record holds any certificate flight.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# The WiFi driver draws its RX buffers from the kernel heap; a sustained
# download otherwise fails an adapter allocation.
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16

# WiFi, mbedTLS and wpa_supplicant leave little SRAM headroom here, so this
# holds even where a sample asks for a debug build.
CONFIG_SIZE_OPTIMIZATIONS=y
