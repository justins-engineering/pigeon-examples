# A raw socket on a Non-IP PDN over NB-IoT: no IP stack and no pigeon
# connector. The claim key belongs in the git-ignored prj.local.conf.

CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
# Verizon delivers NIDD over NB-IoT only.
CONFIG_LTE_NETWORK_MODE_NBIOT=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_ESM_STRERROR=y
# PCO rather than the modem's default ePCO when the PDN is requested.
CONFIG_LTE_LC_PDN_LEGACY_PCO=y
# Reports a modem held back by its reset-loop restriction.
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y
# A Non-IP PDN has no DNS to fall back from.
CONFIG_LTE_LC_DNS_FALLBACK_MODULE=n
# Every modem notification is logged, and some run long.
CONFIG_AT_MONITOR_HEAP_SIZE=1024

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# Platform frames end in a truncated HMAC-SHA256 keyed by the claim key.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# Non-secure application image beside TF-M.
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

CONFIG_SHELL=y
CONFIG_AT_SHELL=y
# AT read commands end in '?', which the shell would take for a wildcard and
# answer with its usage text instead of running the command.
CONFIG_SHELL_WILDCARD=n
# Plain text on the console, so a capture reads without a terminal.
CONFIG_SHELL_VT100_COMMANDS=n

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
