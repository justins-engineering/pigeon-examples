# Default manifest: upstream Zephyr, for the ESP32-C6-DevKitC and native_sim.
#
# The nRF91 Feathers need the nRF Connect SDK's modem libraries and a forked
# Zephyr that cannot share a topdir with this one; they build from a second
# topdir configured against west-ncs.yml.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.1
      import: true

  # The pigeon library is not a west project: ../pigeon is a checkout that
  # common/app.cmake adds as an extra module.

  self:
    path: samples
