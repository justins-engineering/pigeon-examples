# The Pigeon client library over the carrier's Non-IP Data Delivery. The
# endpoint names the Non-IP APN and is the same for every pigeon; the claim key
# is device identity and belongs in the git-ignored prj.local.conf.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_NIDD=y
CONFIG_PIGEON_ENDPOINT="nidd://VZWSCEF"
# One frame per wake carries every reading taken since the last one.
CONFIG_PIGEON_TELEMETRY_BATCH=y
# shadow.c parses target_config; the NIDD connector itself parses no JSON.
CONFIG_JSON_LIBRARY=y

CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
# Verizon serves NIDD over NB-IoT only.
CONFIG_LTE_NETWORK_MODE_NBIOT=y
# A 190-minute periodic TAU with a 60-second active time, the window in which a
# push can page the device. Verizon NB-IoT refused the 30-minute default.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00010011"
CONFIG_LTE_PSM_REQ_RAT="00100001"
# PCO rather than the modem's default ePCO when the Non-IP PDN is requested.
CONFIG_LTE_LC_PDN_LEGACY_PCO=y
# Reports a modem held back by its reset-loop restriction.
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y
# The sample opens no IP socket, so there is no DNS to fall back from.
CONFIG_LTE_LC_DNS_FALLBACK_MODULE=n

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# Non-secure application image beside TF-M.
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
