# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Pigeon"

# Align the max FD entry to NRF_MODEM_MAX_SOCKET_COUNT(8) -- see https_init's
# board conf, same reasoning applies to any modem-offloaded socket use.
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_POLL_MAX=8

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Connection Manager and Connectivity layer
CONFIG_NRF_MODEM_LIB_NET_IF=y

# Without this, connection_manager.c's lte_disconnect() calling
# conn_mgr_all_if_down() fully shuts down the modem library instead of just
# deactivating LTE, leaving lte_lc_power_off()'s subsequent CFUN=0 with no AT
# channel to succeed on (root-caused and hardware-verified against
# https_init -- see that sample's prj.conf for the full writeup; this sample
# shares the same connection_manager.c pattern).
CONFIG_NRF_MODEM_LIB_NET_IF_DOWN_DEFAULT_LTE_DISCONNECT=y

# AT Host
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_AT_HOST_LIBRARY=y

# CONFIG_MODEM_KEY_MGMT: nRF91 TLS sockets are offloaded to the modem,
# which resolves sec_tags against its OWN credential store --
# tls_credential_add() into Zephyr's native store is invisible there. This
# switches pigeon's PSK registration to modem_key_mgmt_write() (%CMNG types
# IDENTITY/PSK, hex-encoded secret), done eagerly at pigeon_init() time
# because the store only accepts writes while the modem is offline -- which
# is why this sample's main.c calls pigeon_init() BEFORE lte_connect().
CONFIG_MODEM_KEY_MGMT=y

# TF-M configurations
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# UART configuration (common)
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# UART configuration (nRF91 specific)
CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
