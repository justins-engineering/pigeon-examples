# Native Simulator offloaded sockets (NSOS), not the TAP/zeth ethernet
# driver: TAP needs net-tools' net-setup.sh run as root (creates a host
# TAP interface, needs NAT to reach anything off-host) -- offloaded
# sockets instead call straight into the host's real BSD socket API
# (socket()/connect()/send()/...), so DNS resolution and routing are
# just whatever this machine's own network stack already does, with zero
# net-setup.sh/root/NAT step required. Modeled on upstream Zephyr's own
# samples/net/sockets/http_get/overlay-nsos.conf (its
# sample.net.sockets.http_get.nsos.https test config is the same NSOS +
# software-TLS combination this file builds, just against a different
# app). CONNECTIVITY_SIM is the piece that makes conn_mgr_all_if_up()/
# _connect() (this sample's connection_manager.c, shared with https_init)
# actually transition through NET_EVENT_L4_CONNECTED the same way a real
# interface would -- without it there's no net_if for conn_mgr to drive.
CONFIG_NETWORKING=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_POSIX_API=y

CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y

# TLS networking
CONFIG_NET_SOCKETS_ENABLE_DTLS=n
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# TLS configuration
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=7168
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y

# This sample's connector is PSK-based (pigeon_coap.c registers
# tls_psk_identity/tls_psk_secret as TLS credentials, not a CA cert) --
# without a PSK ciphersuite, sockets_tls.c rejects the sec_tag at
# setsockopt() time ("TLS with PSK disabled. Reconfigure mbed TLS to
# support PSK based key exchange."), found by actually running this
# native_sim/NSOS build against the real backend, not guessed.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_PSK_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
