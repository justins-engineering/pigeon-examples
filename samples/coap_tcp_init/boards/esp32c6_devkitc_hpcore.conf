# Beyond ../../common/boards/esp32c6.conf.

# The connector authenticates with a pre-shared key, so mbedTLS needs a PSK key
# exchange; without one the TLS socket rejects the sec_tag at setsockopt().
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
# No ciphersuite is pinned, so mbedTLS offers everything these wants allow:
# AES-128-GCM and the constrained-device AES-128-CCM-8, both of which the
# platform's CoAP terminator accepts.
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# The key is imported into PSA as a derive key and run through the TLS 1.2 PRF;
# a missing want fails the import before a byte leaves the device.
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
