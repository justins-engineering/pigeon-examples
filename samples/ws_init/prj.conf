# The HTTPS connector plus a persistent WebSocket channel: the platform pushes
# a shadow the moment the dashboard writes one, and telemetry rides the socket
# that is already open. The endpoint and token belong in prj.local.conf.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_HTTPS=y
CONFIG_PIGEON_WS=y
# The modem's credential store outlives a reflash and is keyed by tag, so each
# sample here owns a distinct one rather than the shared default.
CONFIG_PIGEON_HTTPS_SEC_TAG=43
# The upgrade handshake hashes its key with SHA-1; without this want
# websocket_connect() returns -EPROTO before a byte reaches the network.
CONFIG_PSA_WANT_ALG_SHA_1=y

# Diagnostics an operator runs from the dashboard over the same socket. A
# command that this image does not register answers -ENOEXEC however it is
# spelled here, so the list has to track what the build actually has.
CONFIG_PIGEON_SHELL=y
CONFIG_PIGEON_SHELL_ALLOWLIST="kernel version,kernel uptime"
# The backend's 300-byte default truncates anything past a one-line reply.
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
# Shell commands arrive over the socket, not the console; the serial backend
# would redraw its prompt over every log line.
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_PICOLIBC=y
CONFIG_STD_C17=y
CONFIG_MISRA_SANE=y
# What src/heap_monitor.c reads.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Logging from the connection manager's event callbacks overflows the default.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
# Lets the shadow's "log" field silence and restore logging at runtime.
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_NET_LOG=y
