# Pigeon client library: fetches/reports the device shadow over HTTPS
# (pigeon_https.c), same as wifi_init, plus the persistent CONFIG_PIGEON_WS
# push channel below -- this sample exists specifically to demonstrate that
# transport on its own (shadow_update push, telemetry-over-WS, HTTPS
# fallback, one-socket-per-pigeon), the way https_init/coap_tcp_init are the
# dedicated demos for their own transports. wifi_init is the plain
# HTTPS-polling-over-WiFi sibling with WS turned off entirely -- see that
# sample's README section for why the split exists (WS is an opt-in add-on
# for WiFi/mains-powered devices, not a default any sample should silently
# turn on).
#
# Brings its own network interface up over WiFi (ESP32-C6) instead of LTE
# (nRF9160), and boots with no bootloader at all (see sysbuild.conf --
# esp32c6_devkitc/esp32c6/hpcore's own board Kconfig defaults to requiring
# MCUboot, which this vanilla-Zephyr build (see samples/west-vanilla.yml)
# has no signing-key/MCUboot-image plumbing set up for yet, so it's
# explicitly overridden off here). No CONFIG_PIGEON_FOTA wiring or
# firmware-update shadow handling either, as a consequence -- see this
# repo's README ("ESP32-C6-DevKitC-1 port") for that and the rest of the
# documented gaps.
#
# CONFIG_PIGEON_ENDPOINT/CONFIG_PIGEON_TOKEN and
# CONFIG_WIFI_CREDENTIALS_STATIC_SSID/_PASSWORD are real device/network
# secrets, so they live in the git-ignored prj.local.conf instead
# (auto-merged by CMakeLists.txt if present), e.g.:
# CONFIG_PIGEON_ENDPOINT="https://api.pidgeiot.com/device/pigeons/demo-pigeon-0003"
# CONFIG_PIGEON_TOKEN="replace-with-device-bearer-token"
# CONFIG_WIFI_CREDENTIALS_STATIC_SSID="replace-with-ssid"
# CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="replace-with-psk"
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_HTTPS=y

# Persistent WS push channel alongside the HTTPS connector above -- this is
# the first sample to exercise it, since it's the WiFi (non-cellular)
# use case dovecote's WS endpoint was built for (see pigeon's zephyr/Kconfig).
# CONFIG_WEBSOCKET_CLIENT (+ its HTTP_PARSER/BASE64/PSA_CRYPTO dependencies)
# comes in automatically via Kconfig `select`, not listed separately here.
CONFIG_PIGEON_WS=y

# Remote diagnostic shell over the existing WS socket -- v1 opens no new
# persistent connection (reuses CONFIG_PIGEON_WS's socket purely as a
# transport for two new frame types), so it does NOT need another
# CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS slot despite this file's older comment
# below speculating it might. CONFIG_SHELL/CONFIG_SHELL_BACKEND_DUMMY come in
# automatically via CONFIG_PIGEON_SHELL's Kconfig `select`.
CONFIG_PIGEON_SHELL=y
# Read-only diagnostics only, by deliberate choice for this sample -- see
# zephyr/Kconfig's CONFIG_PIGEON_SHELL_ALLOWLIST help text for the exact
# match semantics (prefix + word boundary). Only commands that actually
# exist in this image belong here: an allowlisted command with no matching
# registered command returns -ENOEXEC for every dashboard attempt at it,
# so the list needs to track what this build actually registers.
CONFIG_PIGEON_SHELL_ALLOWLIST="kernel version,kernel uptime"
# Upstream default (300 bytes, subsys/shell/backends/Kconfig.backends) is
# tight for anything beyond a one-line reply -- bumped for this sample's
# build-verification pass. pigeon_ws_send_shell_output() (pigeon_ws.c) and
# pigeon_shell.c's own truncation check both size/detect off this same
# Kconfig symbol, not a separate pigeon-owned one.
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048

# Wedge-recovery mitigation: this is the sample most exposed to the
# ~42-60min hard wedge this mitigates (real-hardware soak, see this repo's
# CLAUDE.md and pigeon's zephyr/Kconfig help for the full writeup), so it's
# the reference consumer for the fix too. PRIMARY mitigation is
# CONFIG_PIGEON_REBOOT_ON_FATAL -- the actual diagnosed failure is a Zephyr
# fatal error (an ecall-based assert inside Espressif's closed-source WiFi
# blob), and this hook deterministically reboots on ANY such error instead
# of hanging forever, with no watchdog needing to fire at all.
# CONFIG_PIGEON_WATCHDOG is a complementary layer for the different case of
# a silent liveness stall with no fatal error (kernel keeps scheduling,
# app-level progress just stops) -- see that option's own help for the
# currently-open upstream ESP32 hardware-watchdog timing bug it documents.
CONFIG_PIGEON_REBOOT_ON_FATAL=y
CONFIG_PIGEON_WATCHDOG=y

# Steady state with WS on is 1 persistent WS TLS context + 1 transient HTTPS
# context (shadow GET/report, telemetry HTTPS fallback) open concurrently.
# This tree's default is 1 (subsys/net/lib/sockets/Kconfig -- NOT 4 as
# upstream docs suggest), which starves whichever of the two paths loses
# the race (surfaces as persistent -107 TLS-socket-create failures). 3 =
# persistent WS + transient HTTPS + one spare for reconnect overlap;
# revisit if the remote shell adds another long-lived context.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3

# Boot banner
CONFIG_BOOT_BANNER_STRING="Pigeon"

# Set LIBC
CONFIG_PICOLIBC=y

# PicolibC targets C17 and POSIX 2018 standards
CONFIG_STD_C17=y

# Enforce MISRA C standards
CONFIG_MISRA_SANE=y

# Reset Reason and Reboot (shadow.c's "reboot" shadow command uses
# sys_reboot()). No CONFIG_FPU/CONFIG_FPU_SHARING here unlike https_init's
# prj.conf -- ESP32-C6's RISC-V core has no hardware FPU.
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# ESP32-C6 has ample flash (4/8MB modules vs. the nRF9160's tight internal
# flash) but WiFi/mbedTLS/wpa_supplicant already eat a lot of it -- optimize
# for size, not debug, same reasoning as coap_tcp_init's prj.conf.
CONFIG_SIZE_OPTIMIZATIONS=y


# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# Lets shadow.c's "log" field actually toggle logging at runtime via
# log_filter_set() -- see https_init's shadow.c note.
CONFIG_LOG_RUNTIME_FILTERING=y

# Network Logging
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y

# Debugging. No CONFIG_FAULT_DUMP here -- it depends on ARM (see
# zephyr/arch/arm/core/Kconfig), and ESP32-C6's core is RISC-V, so setting
# it is always a no-op on this board (dropped as an unsatisfiable-
# dependency Kconfig warning, fatal under samples/west-vanilla.yml's build).
CONFIG_DEBUG=y

# Stack and heap configurations. Bumped well past https_init's 8192: ESP32's
# WIFI_ESP32 Kconfig (zephyr/drivers/wifi/esp32/Kconfig.esp32) already adds
# its own ~50KB heap pool contribution (HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI) on
# top of whatever this sets.
#
# mbedTLS does NOT draw from this general pool at all: MBEDTLS_MEMORY_
# BUFFER_ALLOC_C hard-redirects mbedtls_calloc()/free() to its own
# dedicated buffer once CONFIG_MBEDTLS_ENABLE_HEAP (below) wires it up, so
# crediting mbedTLS's HTTPS/TLS handshake needs against this pool would be
# wrong. This pool is purely for the WiFi driver's static RX buffers
# (~10 x 1.6KB = ~16KB,
# always resident from esp_wifi_init() -- ESP32_WIFI_STATIC_RX_BUFFER_NUM,
# default 10, zephyr/drivers/wifi/esp32/Kconfig.esp32:90-97), its dynamic
# RX buffers (up to ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM x ~1.6KB, bursty --
# see that option below), and Zephyr's own net_buf/net_pkt pools -- none of
# which this repo's tooling can directly measure (native_sim builds
# against NSOS instead of the real ESP32 WiFi driver, so there's no
# equivalent of the mbedTLS harness for this specific pool). Bumped as a
# reasoned hedge (not a measured number, unlike CONFIG_MBEDTLS_HEAP_SIZE
# below) against the real-hardware "esp32c6_wifi_adapter: memory
# allocation failed" reports, alongside capping the dynamic RX buffer
# ceiling below -- ESP32-C6-DevKitC-1 has 512KB SRAM to spare.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Caps the WiFi driver's dynamic RX buffer pool (drawn from the general heap
# above, zephyr/drivers/wifi/esp32/Kconfig.esp32:104-120) at half its
# default ceiling (32 -> 16). This is a low-throughput control-plane device
# (WS pings/telemetry, occasional HTTPS polls) with no need for 32
# concurrent in-flight received-but-not-yet-processed 802.11 frames (each
# up to ~1.6KB); halving the worst-case burst directly reduces general-heap
# pressure during exactly the reconnect-churn condition that drives up heap
# pressure (more WiFi management/DHCP traffic arriving while the heap is
# already under pressure from other allocations). Not independently
# measured (same native_sim limitation as
# the general pool bump above), but a reasoned, low-risk mitigation: still
# >= ESP32_WIFI_STATIC_RX_BUFFER_NUM (10, unchanged), matching that option's
# own documented recommendation to keep dynamic >= static.
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# TLS credential storage: wifi_connection_manager.c's provision_cert() calls
# tls_credential_add() (there's no modem to offload to on ESP32, unlike
# nRF91 -- see that file's comment) to register the CA cert under
# CONFIG_PIGEON_HTTPS_SEC_TAG's default sec_tag (1, WIFI_SEC_TAG below).
CONFIG_TLS_CREDENTIALS=y

# Net connection manager -- same generic conn_mgr_all_if_*() calls as
# https_init/coap_tcp_init's connection_manager.c, but note that WIFI_ESP32
# does NOT register a conn_mgr connectivity binding for these calls to
# dispatch to
# -- this vendored tree's only such binding choice is
# CONNECTIVITY_WIFI_MGMT_APPLICATION, unset here, so conn_mgr_all_if_connect()
# is a harmless no-op (see wifi_connection_manager.c's wifi_connect()) and
# the actual join is requested explicitly via NET_REQUEST_WIFI_CONNECT_STORED
# instead. CONFIG_NET_CONNECTION_MANAGER itself is still needed for
# conn_mgr_all_if_up()/the L4 connected/disconnected events wifi_connect()
# waits on.
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048

# Default (768-800B) overflowed running the other samples' net_mgmt event
# callback (cert provisioning via tls_credential_add, mbedTLS, logging) on
# this thread's stack -- see https_init's prj.conf note (same TLS/logging-
# heavy callback chain).
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# WiFi (ESP32-C6 station mode). CONFIG_WIFI=y pulls in WIFI_ESP32
# (zephyr/drivers/wifi/esp32/Kconfig.esp32), which auto-selects
# NET_L2_WIFI_MGMT/MBEDTLS/PSA_CRYPTO -- no separate wpa_supplicant module
# needed, hal_espressif's WiFi driver brings its own WPA2/WPA3 stack.
CONFIG_WIFI=y

# Static WiFi credentials (no shell/settings-based provisioning yet -- see
# README gap note): CONFIG_WIFI_CREDENTIALS_STATIC wires these into
# wifi_mgmt's add_static_network_config(), driven by the explicit
# NET_REQUEST_WIFI_CONNECT_STORED request wifi_connect() issues
# (wifi_connection_manager.c) -- NOT by conn_mgr_all_if_connect(), which is
# a no-op here (see CONFIG_NET_CONNECTION_MANAGER's comment above). Same
# static-Kconfig-string-rather-than-runtime-credential-store pattern as
# CONFIG_PIGEON_ENDPOINT/_TOKEN.
#
# Unlike CONFIG_PIGEON_ENDPOINT/_TOKEN, the SSID has a compile-time
# BUILD_ASSERT in wifi_mgmt.c requiring a non-empty string even before
# prj.local.conf's real value is merged in -- so this can't be left unset
# in tracked source the way pigeon's Kconfig strings are. "changeme" here
# is a placeholder that fails loudly (auth/AP-not-found, not a silent
# no-op) if prj.local.conf is ever missing; the real network's SSID/PSK
# belong only there, same as the pigeon token below.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_TYPE_PSK=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="changeme"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="changeme"

# CONFIG_NET_SOCKETS_SOCKOPT_TLS (pigeon_https.c's HTTPS/TLS transport)
# needs the full mbedTLS SSL/TLS protocol stack (MBEDTLS_SSL_CLI_C etc, see
# zephyr/modules/mbedtls/configs/config-mbedtls.h), not just the crypto
# primitives WIFI_ESP32 already pulls in for its own WPA2/WPA3 handshake --
# those are two different mbedTLS feature sets. Without this, sockets_tls.c
# fails to build with "implicit declaration of function
# 'mbedtls_ssl_get_session'" (that function -- and the whole SSL protocol
# layer -- is compiled out unless a TLS version is explicitly selected).
# TLS 1.2 rather than 1.3: simpler cipher/handshake surface, and this is
# what https_init/coap_tcp_init exercise against the same dovecote backend.
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

# MBEDTLS_SSL_PROTO_TLS1_2 (above) selects MBEDTLS_MD_C (generic hash
# dispatch) but doesn't itself pick a concrete hash algorithm -- without
# one, tf-psa-crypto/core/tf_psa_crypto_check_config.h hard-errors
# ("MBEDTLS_MD_C defined, but no hash algorithm") and md.c's now-dead-code
# function bodies fail -Werror=unused-parameter on top of that. SHA-256 is
# what TLS 1.2's standard cipher suites (and the rest of this workspace,
# e.g. pigeon's CONFIG_PIGEON_FOTA sha256 check) already assume.
CONFIG_PSA_WANT_ALG_SHA_256=y

# Nothing above actually selects a TLS 1.2 key exchange method --
# mbedtls_check_config.h hard-errors on that too ("TLS protocol enabled
# but no key exchange methods defined"). ECDHE-RSA/ECDHE-ECDSA cover the
# common real-world CA-issued cert cases (dovecote's CA, GTS_Root_R4.crt
# below, chains through either); PSA_WANT_ALG_ECDH/ECDSA plus the P-256
# curve are what those two key-exchange methods actually execute under
# the PSA crypto API mbedTLS 4.x/tf-psa-crypto uses internally now (see
# tf-psa-crypto/core/tf_psa_crypto_check_config.h) -- listing
# MBEDTLS_KEY_EXCHANGE_* alone isn't enough on its own in this mbedTLS
# version. RSA sign/verify covers ECDHE-RSA's certificate side even
# though the key exchange itself is elliptic-curve.
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
# MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED (above) also depends on
# PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_BASIC (zephyr/modules/mbedtls/
# Kconfig.psa.logic), which auto-derives true only if IMPORT/EXPORT/
# GENERATE is set on RSA_KEY_PAIR -- RSA_PUBLIC_KEY alone doesn't satisfy
# it, even though this client only ever verifies a server's RSA public key
# and never imports an RSA private key at runtime. Surfaced as an
# unsatisfied-dependency Kconfig warning (fatal under
# samples/west-vanilla.yml's build) -- this GTS_Root_R4 chain is ECDSA
# (P-384), not RSA (see the cert-bundle
# comment below), so ECDHE-RSA support here is defensive breadth, never
# actually exercised by this sample's real handshake.
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y

# Key exchange alone isn't a complete cipher suite -- TLS also needs a bulk
# symmetric cipher, and without one selected, ssl_msg.c's AEAD
# authenticated-encryption code paths become dead code and fail
# -Werror=unused-variable/-function the same way md.c did with no hash
# algorithm above. AES-GCM is the standard modern choice (matches what
# ECDHE-RSA/ECDHE-ECDSA-AES128-GCM-SHA256, one of the most common suites
# real HTTPS servers offer, actually needs).
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# TCP: same nRF91-heritage trap as the DNS block below -- the cellular
# samples never enable native TCP because the modem's offloaded sockets
# provide it. On the native stack SOCK_STREAM creation fails outright,
# surfacing as -107/ENOTCONN from TLS socket create once DNS resolution
# itself is working.
CONFIG_NET_TCP=y

# DNS: unlike the nRF91 samples (https_init/coap_tcp_init), where sockets --
# including getaddrinfo() -- are offloaded to the modem and the modem does
# name resolution, ESP32-C6 runs Zephyr's native IP stack, which has NO
# resolver unless one is compiled in; without one every getaddrinfo() fails
# with -2. Static public resolvers rather than
# CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS, deliberately: with that option
# enabled, a dns_resolve_reconfigure() failure while parsing a DHCP offer's
# DNS option makes dhcpv4.c reject the WHOLE offer -- logged only at debug
# level -- so DHCP never completes and the board never gets an IP (a silent
# 30s connectivity timeout with nothing pointing at DNS as the cause).
# MAX_NAME_LEN: the default (20) is shorter than our 52-char staging
# hostname -- resolution fails before any query is even sent.
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="1.1.1.1"
CONFIG_DNS_SERVER2="8.8.8.8"
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=64

# PEM parsing: the CA cert ships as PEM (cert/GTS_Root_R4.crt) and mbedTLS
# without PEM_PARSE_C only accepts DER -- provisioning fails -0x2180
# (X509 invalid format) at sec_tag load. Another nRF91-heritage gap: the
# modem's offloaded TLS accepts PEM natively, so the cellular samples never
# needed this. PEM (not DER conversion) kept deliberately -- it's the
# format CAs hand out, friendlier for a sample.
CONFIG_MBEDTLS_PEM_PARSE_C=y

# The CA we provision (cert/GTS_Root_R4.crt) is an ECC P-384 root, and the
# workers.dev chain (GTS WE1 intermediate) verifies with SHA-384 -- the
# P-256/SHA-256-only menu above covers common leaf suites but can't even
# parse this root's public key (mbedTLS -0x2100 at provisioning).
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_SHA_384=y

# TLS record buffers: the tree default (1500 in/out) cannot hold Cloudflare's
# TLS 1.2 certificate flight (leaf + GTS WE1 intermediate, >2KB in one
# record). 16KiB in = the TLS maximum, safe against any chain; 4KiB out is
# ample for our requests (WS frames <=1KiB). This bump alone does not fix
# the -0x7780 handshake failure documented below -- that turns out to be a
# missing-SNI issue, not a record-size one -- but it's still needed and
# correct on its own (the Certificate message really doesn't fit in 1500
# bytes), so it stays regardless.
#
# Single symmetric knob under vanilla Zephyr (samples/west-vanilla.yml):
# CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN/_OUT_CONTENT_LEN (separately-settable
# in/out sizes) is an nRF Connect SDK-only Kconfig extension --
# zephyr/modules/mbedtls/Kconfig.mbedtls upstream only exposes one
# CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN, applied to both directions
# (config-mbedtls.h #defines MBEDTLS_SSL_IN/OUT_CONTENT_LEN from the same
# value). Set to the larger (16KiB) of the two previous asymmetric values,
# since this Kconfig can't express "small out, large in".
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# net_conn slots: 4 (default) is exhausted by 2 persistent DNS-server conns
# + concurrent WS and HTTPS TLS/TCP attempts -- surfaces as "Not enough
# connection contexts".
CONFIG_NET_MAX_CONN=8

# --- TLS handshake fatal-alert (-0x7780) root cause ---
#
# Four independent, compounding gaps -- each only surfaces once the
# previous is fixed, since a handshake failing at gap N never reaches gap
# N+1:
#
# 1. No SNI (server_name ClientHello extension) is ever sent.
#    mbedtls_ssl_set_hostname() (what Zephyr's TLS_HOSTNAME sockopt calls)
#    needs this Kconfig to actually emit the extension --
#    zephyr/modules/mbedtls/configs/config-mbedtls.h only #defines
#    MBEDTLS_SSL_SERVER_NAME_INDICATION when it's set.
#    Cloudflare's edge can't route a TLS connection to the right
#    zone/worker without SNI on a shared IP and responds with a fatal
#    handshake_failure alert (level 2, description 40) immediately after
#    ClientHello, before ever sending ServerHello -- this is the actual
#    cause of the -0x7780 failure, not a record-size issue (see the
#    CONTENT_LEN bump above).
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
#
# 2. Once SNI is fixed and a real ServerHello/Certificate flight starts
#    arriving, mbedTLS's own allocator has no memory: config-tf-psa-crypto.h
#    unconditionally compiles in MBEDTLS_MEMORY_BUFFER_ALLOC_C, which
#    hard-redirects mbedtls_calloc()/free() to its own dedicated static
#    buffer rather than Zephyr's general heap -- bumping the unrelated
#    general CONFIG_HEAP_MEM_POOL_SIZE does nothing for this, since that
#    buffer is only ever handed to the allocator
#    (zephyr/modules/mbedtls/zephyr_init.c:26-43,
#    mbedtls_memory_buffer_alloc_init()) once CONFIG_MBEDTLS_ENABLE_HEAP is
#    set below. Without it, every allocation mbedTLS makes (starting with
#    the ~16KiB CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN buffer above) fails
#    outright. See the memory-sizing note further below for how
#    CONFIG_MBEDTLS_HEAP_SIZE's value was arrived at -- it's a measured
#    number, not a guess.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
#
# 3. Once past cert verification (which succeeds fine -- P-384 root, P-256
#    leaf, all already-wanted), ECDHE key exchange fails silently
#    (MBEDTLS_ERR_SSL_HW_ACCEL_FAILED, no debug message pinpointing why --
#    modules/crypto/mbedtls/library/ssl_tls12_client.c:2408's
#    psa_generate_key() just returns it on any PSA failure). ECDHE needs a
#    FRESH ephemeral EC key pair generated per handshake (forward secrecy)
#    -- CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT above only covers
#    importing/holding an *existing* key, a distinct PSA capability from
#    generating a new one.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
#
# 4. Once ECDHE succeeds, master-secret derivation fails the same silent
#    way (ssl_tls.c:6438-6443's handshake->tls_prf() call ->
#    MBEDTLS_ERR_SSL_HW_ACCEL_FAILED). TLS 1.2's PRF is its own distinct
#    PSA algorithm in this architecture, PSA_ALG_TLS12_PRF(hash) -- neither
#    the raw hash alg (already wanted above) nor a generic want covers it.
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
#
# With all four applied, a full handshake against the real dovecote-staging
# endpoint completes cleanly (plaintext application data exchange, then a
# clean close_notify).
#
# Debug-hookup gotcha: enabling CONFIG_MBEDTLS_DEBUG=y +
# CONFIG_MBEDTLS_DEBUG_LEVEL=2 + CONFIG_NET_SOCKETS_LOG_LEVEL_DBG does NOT
# get any <dbg> output out of mbedTLS. CONFIG_MBEDTLS_DEBUG_LEVEL
# (zephyr/modules/mbedtls/Kconfig:102-109) has no independent `prompt` --
# it's a plain `default N if MBEDTLS_LOG_LEVEL_X` derived int, so a direct
# `=2` assignment in a .conf fragment has no defined symbol to attach to
# and is silently dropped by the Kconfig merge (it stays at its computed
# default, 0, in the actual .config despite that line).
# mbedtls_debug_set_threshold() (zephyr_init.c:50-51) is seeded from that
# same always-0 value, so mbedTLS's *own* internal debug filter suppresses
# virtually everything before it ever reaches the Zephyr log level gate --
# CONFIG_NET_SOCKETS_LOG_LEVEL_DBG only ever controls sockets_tls.c's own
# separate "net_sock_tls" log module, not mbedTLS's internal trace (its own
# separate "mbedtls" log module, zephyr/modules/mbedtls/debug.c:9, gated by
# CONFIG_MBEDTLS_LOG_LEVEL -- a third, also-distinct symbol). Selecting the
# underlying `MBEDTLS_LOG_LEVEL_DBG` choice option instead correctly
# propagates to both CONFIG_MBEDTLS_DEBUG_LEVEL and CONFIG_MBEDTLS_LOG_LEVEL
# at once, since both derive their default from the same choice selection.
# Not enabled here by default -- only worth turning on when actively
# debugging a TLS handshake.

# --- WS upgrade failure (-71/EPROTO from websocket_connect()) ---
#
# zephyr/subsys/net/lib/websocket/websocket.c's websocket_connect() calls
# psa_hash_compute(PSA_ALG_SHA_1, ...) directly, twice (lines 282-288,
# 351-357) -- RFC 6455's Sec-WebSocket-Key/Sec-WebSocket-Accept handshake
# mandates SHA-1 unconditionally (an integrity check baked into the spec,
# not a security-sensitive use, and not something this library can avoid
# or negotiate around). Neither call is wrapped in a debug message on
# failure, so PSA_WANT_ALG_SHA_1 not being wanted anywhere in this file
# surfaces only as websocket_connect() returning a bare -EPROTO (-71) with
# zero further detail -- and on the very FIRST of those two PSA calls,
# before any request byte is even built, let alone sent. That's what makes
# this gotcha easy to misdiagnose as a server/route/auth/credentials
# problem: the device never gets far enough to talk to the network for
# this specific call, so nothing about the failure points at TLS/PSA
# config.
CONFIG_PSA_WANT_ALG_SHA_1=y

# --- WS reconnect and memory-sizing notes ---
#
# WS's advantage over HTTPS polling, measured on real hardware:
# dashboard-push -> shadow_update -> apply -> report converges in ~1s, and
# telemetry-over-WS lands in ~10ms vs. the ~10s HTTPS poll cycle. Two
# hardware-relevant gotchas below, surfaced by a deliberate socket-steal
# test (a second client connecting as the same pigeon, forcing dovecote's
# one-socket-per-pigeon policy to close the device's existing connection)
# and by watching the WiFi adapter's own memory behavior across that churn.
#
# 1. WS context leak on server-initiated close -- handled in ~/pigeon's
#    pigeon_ws.c, not here, but the underlying Zephyr quirk is worth
#    knowing when debugging a socket that won't reconnect: Zephyr's own
#    websocket.c internal-disconnect trigger is an *exact-equality* check
#    against WEBSOCKET_FLAG_CLOSE, which a real (always FIN-set, per RFC
#    6455 sec 5.5.1) CLOSE frame can never match -- so relying on
#    websocket_recv_msg() to unref the context internally on a
#    server-initiated close leaks the sole CONFIG_WEBSOCKET_MAX_CONTEXTS(=1)
#    slot permanently (every subsequent upgrade attempt then fails
#    instantly with -17/EEXIST, websocket_find() matching the leaked
#    context's stale real_sock value against a reused fd number).
#    pigeon_ws_teardown() (pigeon_ws.c) always calls
#    websocket_disconnect() itself regardless of what the library's own
#    internal path may or may not have done, closing the leak
#    unconditionally; see that function's docstring for the residual
#    (structurally near-zero, spec-contradicting) risk of a double-unref
#    this creates for a hypothetically non-compliant peer.
#
# 2. Memory sizing. A native_sim harness running the real HTTPS
#    (pigeon_shadow_get) and WS (pigeon_ws_start) paths concurrently
#    against real dovecote-staging (an HTTPS request fired *while* the WS
#    TLS context is alive and idle -- the real device's worst case, two
#    live mbedTLS SSL contexts at once), reading mbedTLS's actual peak
#    usage via mbedtls_memory_buffer_alloc_max_get()/_cur_get() (needs
#    CONFIG_MBEDTLS_MEMORY_DEBUG, only in the harness, not added here),
#    gives:
#      - WS alone, steady-state resident: ~21.3KiB (21768 bytes)
#      - HTTPS alone (transient, freed after each request): peaks ~31.5KiB
#        (32280 bytes), returns to 0 after teardown
#      - HTTPS fired while WS stays up (the real concurrent case), repeated
#        4x back to back: peaks at a *consistent* 52.8KiB (54072 bytes)
#        every time -- no growth across iterations, so not a leak, just the
#        real concurrent high-water mark. (CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3,
#        already set above, is required for this concurrent case to even be
#        *attempted* -- without it the second TLS socket create fails at
#        tls_context_alloc()'s fixed pool with -ENOMEM before ever reaching
#        mbedTLS's own allocator, which would hide the real number.)
#    98304 (96KiB, ~1.8x the measured 52.8KiB peak) above is sized off this
#    measurement rather than a round-number guess. Caveat: native_sim is a
#    64-bit host; the real target (ESP32-C6) is 32-bit, so mbedTLS's own
#    pointer-bearing internal structures are smaller there -- if anything
#    this measurement is a conservative (slightly high) estimate of the
#    real target's need, not an underestimate.
#
#    The general heap pool bump (CONFIG_HEAP_MEM_POOL_SIZE, above) and the
#    WiFi dynamic RX buffer cap (CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM,
#    also above) are NOT similarly measured -- native_sim builds against
#    NSOS instead of the real ESP32 WiFi driver, so there's no equivalent
#    harness for that pool. Those two are a reasoned hedge against the
#    real-hardware "esp32c6_wifi_adapter: memory allocation failed" reports
#    (a different allocator/pool than mbedTLS's, isolated from it by this
#    same measurement), not a measured number -- see their own comments
#    above for the reasoning. If those reports persist, the next step
#    would be adding real instrumentation on hardware (this repo's tooling
#    has no way to measure the WiFi driver's own heap pressure from a host
#    machine).

# CONFIG_SYS_HEAP_RUNTIME_STATS wires up
# sys_heap_runtime_stats_get() for the system heap above (CONFIG_HEAP_MEM_
# POOL_SIZE's backing _system_heap, zephyr/kernel/mempool.c -- the same pool
# the WiFi driver's RX buffers draw from and the built-in "kernel heap" shell
# command reads); src/heap_monitor.c logs free/allocated/max_allocated bytes
# every 30s so a real-hardware soak can show free-bytes trend vs. uptime
# (leak vs. arrested vs. fragmentation -- see that file's header comment).
CONFIG_SYS_HEAP_RUNTIME_STATS=y
