# native_sim has no ESP32-C6 WiFi radio -- src/net/native_sim_connection_manager.c
# (selected by CMakeLists.txt for this board) swaps the real WiFi bring-up
# for a generic conn_mgr flow over Native Simulator offloaded sockets
# (NSOS), same rationale as coap_tcp_init's native_sim board conf: NSOS
# calls straight into the host's own BSD socket API, so DNS/routing/connect
# just use whatever this machine's network stack already does -- no
# net-setup.sh/root/TAP/NAT step needed at all. pigeon's HTTPS transport
# code, and every TLS/PSA fix below this file's own additions (still
# supplied by prj.conf, unchanged), are exactly what real ESP32-C6 hardware
# needed too -- this file only swaps out the network *bring-up*, the point
# of a native_sim variant being to exercise the platform protocol, not WiFi.

# CONFIG_WIFI is a plain bool (no board-forced default the way
# ETH_NATIVE_TAP is), so overriding it here is a normal .conf override, not
# a Kconfig "select" fight. WIFI_CREDENTIALS/_STATIC have no "depends on
# WIFI" of their own, but are disabled anyway since this board never reads
# them; ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM lives under WIFI_ESP32's own
# Kconfig.esp32, unreachable once CONFIG_WIFI=n, so it's dropped rather than
# assigned to avoid an unsatisfied-dependency warning (fatal under this
# workspace's west-vanilla.yml build).
CONFIG_WIFI=n
CONFIG_WIFI_CREDENTIALS=n
CONFIG_WIFI_CREDENTIALS_STATIC=n

# No DHCP client either -- native_sim_connection_manager.c assigns a fixed
# dummy address itself (see its own comment for why conn_mgr needs one at
# all with NSOS's connectivity-sim interface).
CONFIG_NET_DHCPV4=n

CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y
