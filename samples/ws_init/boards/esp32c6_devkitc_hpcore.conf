# Beyond ../../common/boards/esp32c6.conf.

# A rare assert inside the closed-source WiFi blob reaches Zephyr's fatal
# handler, whose default is to spin forever; reboot instead. The watchdog
# covers the other shape, a stall that never asserts at all.
CONFIG_PIGEON_REBOOT_ON_FATAL=y
CONFIG_PIGEON_WATCHDOG=y

