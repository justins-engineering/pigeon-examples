# Pigeon client library over MQTT: one persistent TLS session to the
# pigeonhole broker, which bridges every publish onto the platform's device
# routes. The endpoint names the broker rather than this pigeon
# (mqtts://<host>:8883, no path), and the pigeon id, token or PSK secret are
# real device identity, so all of them live in the git-ignored
# prj.local.conf (auto-merged by CMakeLists.txt if present), e.g.:
#
#   CONFIG_PIGEON_ENDPOINT="mqtts://mqtt.pidgeiot.com:8883"
#   CONFIG_MQTT_INIT_PIGEON_ID="<64 hex chars>"
#   CONFIG_PIGEON_TOKEN="<device bearer token>"          # certificate mode
#   CONFIG_PIGEON_MQTT_TLS_PSK_SECRET="<minted psk>"     # PSK mode
#
# Which authentication mode is compiled in is a board-conf choice here:
# native_sim runs TLS-PSK against a local broker, esp32c6 verifies the
# broker's certificate chain. Everything board- or mode-specific lives in
# boards/*.conf so this file stays common to both.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_MQTT=y

# Deliberate rather than defaulted, as pigeon's Kconfig asks: these boards
# are mains-powered and always on, so a minute of silence before the broker
# starts wondering is the right trade. A device that sleeps between reports
# wants this raised (the broker honors up to 30 minutes and closes after
# 1.5x silence) -- the wrong value here is a device the broker keeps
# disconnecting, not a build error.
CONFIG_MQTT_KEEPALIVE=60

# Reset Reason and Reboot (shadow.c's "reboot" shadow command uses sys_reboot())
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Deferred rather than immediate, which CONFIG_PIGEON_LOG_UPLOAD below
# requires in practice: its backend fills a ring buffer that the flush work
# item drains, which is lock-free only while a single thread does the
# filling. Deferred mode makes the log processing thread that sole producer;
# immediate mode runs the backend inline on whichever thread happened to
# log, so two of them can race inside the same buffer. That thread gets CPU
# because shadow_loop() sleeps between passes.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Lets shadow.c's "log" field actually toggle logging at runtime via
# log_filter_set() -- see https_init's shadow.c note.
CONFIG_LOG_RUNTIME_FILTERING=y

# Ship this device's logs to the platform as Zephyr dictionary-encoded
# binary, which over MQTT is a QoS 1 publish to pigeon/logs (chunks larger
# than the platform's 16KiB cap split across consecutive publishes -- see
# pigeon's pigeon_mqtt.c). The console is unaffected and stays
# human-readable: dictionary encoding is per-backend, and only pigeon's
# backend uses it.
#
# Decoding a chunk needs THIS build's log_dictionary.json (written to
# build/zephyr/ because CONFIG_PIGEON_LOG_UPLOAD selects
# CONFIG_LOG_DICTIONARY_SUPPORT). A dictionary from a different build does
# not error, it silently decodes to plausible nonsense -- archive the
# dictionary alongside whatever binary got flashed.
CONFIG_PIGEON_LOG_UPLOAD=y
CONFIG_PIGEON_LOG_UPLOAD_BUF_SIZE=4096
CONFIG_PIGEON_LOG_UPLOAD_BATCH_SIZE=2048

# Stack and heap configurations
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# MQTT is a stream protocol, so unlike the CoAP/DTLS samples this needs real
# TCP -- and at least one packet protocol under it, or the net stack refuses
# to build at all. The ESP32-C6 conf turns IPv6 back off (that radio reaches
# the broker over IPv4 and DAD/MLD is unused surface there); native_sim keeps
# both, though NSOS bypasses the IP stack entirely.
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# TLS credential storage: on a PSK build pigeon registers the identity and
# secret from pigeon_init()'s config under CONFIG_PIGEON_MQTT_SEC_TAG; on a
# certificate build the sample's connection manager provisions the broker's
# trust anchor under the same tag.
CONFIG_TLS_CREDENTIALS=y

# Net connection manager
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# Default (768-800B) overflowed running the net_mgmt event callback on this
# thread's stack in the sibling samples -- see https_init's prj.conf note
# (same TLS/logging-heavy callback chain).
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
