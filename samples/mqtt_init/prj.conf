# The Pigeon client library over MQTT: one persistent TLS session to the
# platform's broker, which bridges every publish onto the device routes. The
# endpoint names the broker rather than this pigeon (mqtts://<host>:8883, no
# path), and the pigeon id, token and PSK secret are device identity, so all
# of them belong in the git-ignored prj.local.conf.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_MQTT=y
# The modem's credential store outlives a reflash and is keyed by tag, so each
# sample here owns a distinct one rather than the shared default.
CONFIG_PIGEON_MQTT_SEC_TAG=47

# Which authentication mode is compiled in is a board choice, so it lives in
# boards/*.conf: TLS-PSK on the Feathers and native_sim, the broker's
# certificate chain on the ESP32-C6.

# Mains-powered and always on, so a minute of silence before the broker starts
# wondering is the right trade. A device that sleeps between reports wants
# this raised; the broker honours up to 30 minutes and closes after 1.5x.
CONFIG_MQTT_KEEPALIVE=60

# Reset cause, reported as telemetry on the first pass after a boot.
CONFIG_HWINFO=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Deferred, not immediate, because the log upload backend fills a ring buffer
# that is lock-free only while a single thread writes it. Deferred mode makes
# the log processing thread that sole writer.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# Lets the shadow's "log" field silence and restore logging at runtime.
CONFIG_LOG_RUNTIME_FILTERING=y

# This device's own logs, uploaded as Zephyr dictionary-encoded binary. The
# console stays human-readable; only the upload backend encodes. Decoding a
# chunk needs this build's log_dictionary.json, and a dictionary from another
# build decodes to plausible nonsense rather than erroring.
CONFIG_PIGEON_LOG_UPLOAD=y
CONFIG_PIGEON_LOG_UPLOAD_BUF_SIZE=4096
CONFIG_PIGEON_LOG_UPLOAD_BATCH_SIZE=2048

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Logging from the connection manager's event callbacks overflows the default.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# MQTT is a stream protocol, so this needs real TCP and at least one packet
# protocol under it, or the net stack refuses to build.
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# Generous rather than needed. The socket layer consults this only when the
# handshake has to block, so a cap that is exceeded abandons a session the
# broker has already accepted and surfaces as a bare timeout with no TLS
# error, which reads as a broken broker rather than a slow device.
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=45000
