# Beyond ../../common/boards/nrf91.conf.

# TLS-PSK: the modem holds the identity and secret in its own credential
# store, which the library writes at pigeon_init() time, and the broker
# resolves this pigeon's token server-side from the handshake identity.
CONFIG_PIGEON_MQTT_AUTH_PSK=y

# Modem trace on uart1 (see the overlay); the backend choice only applies
# once the trace subsystem itself is on.
CONFIG_NRF_MODEM_LIB_TRACE=y
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_UART=y
CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
