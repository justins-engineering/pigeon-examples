# Beyond ../../common/boards/esp32c6.conf.

# Certificate authentication: the shape every off-the-shelf MQTT client also
# speaks. The broker serves a Let's Encrypt chain, this build verifies it
# against cert/isrg-root-x2.pem, and the CONNECT password is
# CONFIG_PIGEON_TOKEN.
CONFIG_PIGEON_MQTT_AUTH_CERT=y
