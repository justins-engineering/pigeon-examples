# ESP32-C6 flavor: certificate authentication over real WiFi -- the shape a
# mains-powered device takes, and the one every off-the-shelf MQTT client
# also speaks. The broker serves a Let's Encrypt chain, this build verifies
# it against ISRG Root X2 (cert/isrg-root-x2.pem, provisioned by
# src/net/wifi_connection_manager.c), and the CONNECT password is
# CONFIG_PIGEON_TOKEN. A PSK build for this board works too -- swap this one
# line for CONFIG_PIGEON_MQTT_AUTH_PSK=y plus the PSK want-list in
# boards/native_sim_native_64.conf -- but the certificate path is what this
# board is here to demonstrate.
CONFIG_PIGEON_MQTT_AUTH_CERT=y

# WiFi station bring-up (src/net/wifi_connection_manager.c). CONFIG_WIFI=y
# pulls in WIFI_ESP32, which auto-selects NET_L2_WIFI_MGMT/MBEDTLS/
# PSA_CRYPTO -- no separate wpa_supplicant module needed.
CONFIG_WIFI=y

# Static credentials (no shell/settings-based provisioning). The SSID has a
# compile-time BUILD_ASSERT in wifi_mgmt.c requiring a non-empty string even
# before prj.local.conf's real value is merged in, so this can't be left
# unset in tracked source -- "changeme" fails loudly (auth/AP-not-found) if
# prj.local.conf is ever missing, same convention as CONFIG_PIGEON_ENDPOINT.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_TYPE_PSK=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="changeme"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="changeme"

# conn_mgr's L4 connected/disconnected events (wifi_connection_manager.c
# waits on these) need a bigger monitor thread stack than the tree default
# once WiFi/mbedTLS is in the callback chain underneath it.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048

# The broker is reached over IPv4 here; IPv6's DAD/MLD machinery on the real
# WiFi L2 is unused surface, disabled outright rather than fought with,
# matching this repo's other ESP32-C6 samples.
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y

# ESP32-C6 runs Zephyr's native IP stack (no offloaded modem resolver), so
# getaddrinfo() needs a real resolver wired up or every lookup fails -2.
# Static public resolvers rather than CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS:
# a dns_resolve_reconfigure() failure while parsing a DHCP offer's DNS
# option makes the whole offer get rejected, so DHCP silently never
# completes (same finding as wifi_init/ws_init's own DNS note).
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="1.1.1.1"
CONFIG_DNS_SERVER2="8.8.8.8"
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=64

# TLS over the native socket stack. The want-list below is wifi_init's
# hard-won X.509 handshake set (each item there has the failure it fixes
# written next to it -- SNI, the mbedTLS heap, ECDHE key GENERATION as
# distinct from import, and TLS 1.2's own PRF) with one deliberate
# subtraction: no RSA anywhere. The broker's chain is all-ECDSA by
# construction -- a P-256 leaf under an ECDSA intermediate anchored at ISRG
# Root X2 -- which is exactly what pinning that anchor buys a constrained
# build, so ECDHE-RSA and the RSA key-pair wants wifi_init needs for
# Google's cross-signed bundle have nothing to do here.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# The CA ships as PEM and mbedTLS without PEM_PARSE_C only accepts DER --
# provisioning otherwise fails -0x2180 (X509 invalid format) at sec_tag load.
CONFIG_MBEDTLS_PEM_PARSE_C=y

# Without this the server_name extension is never emitted, whatever
# TLS_HOSTNAME is set to -- and a broker behind a name-based front end
# answers a bare ClientHello with a fatal handshake_failure (see wifi_init's
# prj.conf for the full trace of that exact failure).
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
# ISRG Root X2 is a P-384 key signing with SHA-384; the leaf and the session
# are P-256/SHA-256. Both curves and both hashes are needed to verify one
# chain.
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
# ECDHE generates a FRESH ephemeral key pair per handshake (that is the
# forward secrecy), a distinct PSA capability from importing an existing
# one -- without it the handshake fails as an opaque HW_ACCEL_FAILED.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# TLS 1.2's master-secret derivation is its own PSA algorithm, covered by
# neither the raw hash want above nor a generic one; it fails the same
# silent way without these three.
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# TLS record buffers: the tree default (1500 in/out) cannot hold a
# certificate flight. 8192 covers this broker's leaf-plus-intermediate chain
# with room to spare -- it caps its own send fragment at 4096 precisely so
# small-buffer clients work -- rather than wifi_init's 16384, which sizes for
# Cloudflare's larger flight.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192

# MBEDTLS_MEMORY_BUFFER_ALLOC_C (compiled in unconditionally by this tree's
# tf-psa-crypto config) hard-redirects mbedtls_calloc()/free() to its own
# dedicated static buffer rather than Zephyr's general heap -- without
# CONFIG_MBEDTLS_ENABLE_HEAP that buffer is never wired up and every mbedTLS
# allocation fails outright. Sized from wifi_init's measured
# single-TLS-context peak (~31.5KiB) with the same ~2x margin; this sample
# holds ONE long-lived session rather than opening a transient one per
# request, so the peak is if anything lower. Not independently re-measured
# on this board -- a reasoned reuse, and this flavor is build-verified only.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536

# ESP32-C6's WiFi/mbedTLS/wpa_supplicant stack already eats a lot of flash;
# optimize for size rather than debug, same reasoning as this repo's other
# ESP32-C6 samples.
CONFIG_SIZE_OPTIMIZATIONS=y

# Purely for the WiFi driver's own RX buffers and Zephyr's net_buf/net_pkt
# pools -- mbedTLS draws from its own dedicated buffer above, not this pool.
# Bumped as a reasoned hedge against the "esp32c6_wifi_adapter: memory
# allocation failed" reports the other samples on this board hit under
# reconnect churn; ESP32-C6-DevKitC-1 has 512KB SRAM to spare.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
