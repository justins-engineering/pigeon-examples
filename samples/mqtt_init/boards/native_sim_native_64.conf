# native_sim flavor: TLS-PSK against a broker running on this host, which is
# the development loop and what scripts/test/native-sim-e2e.sh drives. PSK
# rather than certificates by default because it is the mode with nothing to
# provision -- pigeon registers the identity and secret itself from
# pigeon_init()'s config -- and because it is the constrained-device path
# worth exercising somewhere cheap. A certificate run against a local broker
# works too, with PIGEON_MQTT_AUTH_CERT and the dev CA passed as
# -DPIGEON_MQTT_CA_FILE (see CMakeLists.txt).
CONFIG_PIGEON_MQTT_AUTH_PSK=y

# Native Simulator offloaded sockets (NSOS), not the TAP/zeth ethernet
# driver -- same rationale and structure as coap_dtls_init's native_sim
# conf (no root/net-setup.sh needed; NSOS calls straight into the host's BSD
# socket API). CONNECTIVITY_SIM is what lets this sample's
# native_sim_connection_manager.c drive conn_mgr through
# NET_EVENT_L4_CONNECTED like a real interface would.
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_POSIX_API=y

CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y

# TLS over the offloaded TCP socket, in Zephyr's own mbedTLS.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000

# The broker sets a 4096-byte maximum send fragment precisely so a
# small-buffer mbedTLS build can read its certificate flight and a large
# retained shadow; 7168 leaves that comfortably covered while staying well
# under the 16KiB the certificate samples need.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=7168

# PSK key exchange. Deliberately NOT a CONFIG_MBEDTLS_CIPHERSUITE_* pin:
# with no explicit ciphersuite list configured, mbedTLS offers every suite
# the enabled key exchange plus the PSA wants below allow, which covers all
# three suites the broker offers (PSK-AES128-CCM8, PSK-AES128-GCM-SHA256,
# PSK-AES128-CBC-SHA256) and lets its server-preference order decide. Which
# one actually gets negotiated is worth reading out of a run rather than
# assuming, and the connector logs it per session: this offer lands on
# PSK-AES128-CCM8 (0xC0A8), the constrained-device target, against a broker
# that relaxes OpenSSL's default security level for a hello asking for it.
# Against one that does not -- any stock OpenSSL listener -- the same offer
# lands on GCM instead, which is exactly why GCM stays wanted below rather
# than trimming this list to the suite we want.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# The PSK itself is imported into PSA as a PSA_KEY_TYPE_DERIVE key run
# through the TLS 1.2 PRF (HMAC-SHA256) -- without every want below,
# mbedtls_ssl_conf_psk()'s psa_import_key() fails and the handshake dies
# before a single byte leaves the device (found by running a real build
# against a real server, not by reading Kconfig -- see coap_dtls_init's
# native_sim conf for the original finding).
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y

# Disable Duplicate Address Detection (DAD) due to not being properly
# implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
