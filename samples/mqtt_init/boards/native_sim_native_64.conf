# Beyond ../../common/boards/native_sim.conf.

# TLS-PSK: the mode with nothing to provision, since the library registers the
# identity and secret itself from pigeon_init()'s config.
CONFIG_PIGEON_MQTT_AUTH_PSK=y

# No CONFIG_MBEDTLS_CIPHERSUITE_* pin: with no explicit list, mbedTLS offers
# every suite the key exchange and the PSA wants below allow, which covers all
# three the broker offers and lets its server preference decide.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# The PSK is imported into PSA as a derive key run through the TLS 1.2 PRF;
# without every want below the handshake dies before a byte leaves the device.
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
