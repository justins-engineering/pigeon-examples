# Certificate mode on a board whose TLS runs in Zephyr's own mbedTLS, as an
# overlay on top of a board conf that does not already carry an X.509
# want-list -- boards/native_sim_native_64.conf, which is TLS-PSK by default
# because that is the mode with nothing to provision.
#
#   west build -b native_sim/native/64 samples/mqtt_init -- \
#     -DEXTRA_CONF_FILE=overlay-cert-native-tls.conf \
#     -DPIGEON_MQTT_CA_FILE=<broker CA pem>
#
# scripts/test/native-sim-e2e.sh --cert does exactly that against a local
# broker and its development CA.
#
# boards/esp32c6_devkitc_hpcore.conf carries the same list inline, with the
# same per-item reasoning, because a Zephyr .conf cannot include another
# one -- so this is a copy on purpose rather than shared configuration. If
# one of them gains an item, check whether the other needs it too.
CONFIG_PIGEON_MQTT_AUTH_CERT=y

CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# The CA ships as PEM, and mbedTLS without PEM_PARSE_C only accepts DER --
# provisioning otherwise fails -0x2180 (X509 invalid format) at sec_tag load.
CONFIG_MBEDTLS_PEM_PARSE_C=y
# Without this the server_name extension is never emitted whatever
# TLS_HOSTNAME is set to -- and Zephyr's TLS socket layer refuses the
# hostname option outright (-ENOTSUP) rather than silently skipping it, so
# the connection fails before a byte leaves the device.
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
# The production chain is a P-256 leaf under an ECDSA intermediate anchored
# at ISRG Root X2, which is P-384/SHA-384; both curves and both hashes are
# needed to verify one chain. A local development CA is P-256 throughout,
# but a build that only works against the dev CA would prove less.
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
# ECDHE generates a FRESH ephemeral key pair per handshake (that is the
# forward secrecy), a distinct PSA capability from importing an existing
# one -- without it the handshake fails as an opaque HW_ACCEL_FAILED.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# TLS 1.2's master-secret derivation is its own PSA algorithm, covered by
# neither the raw hash want above nor a generic one.
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
