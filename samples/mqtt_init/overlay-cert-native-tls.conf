# Certificate mode on a board whose TLS runs in Zephyr's own mbedTLS and whose
# board conf selects TLS-PSK:
#
#   west build -b native_sim/native/64 samples/mqtt_init -- \
#     -DEXTRA_CONF_FILE=overlay-cert-native-tls.conf \
#     -DPIGEON_MQTT_CA_FILE=<broker CA pem>
#
# boards/esp32c6_devkitc_hpcore.conf carries the same want-list inline, because
# a Zephyr .conf cannot include another one. If one gains an item, check
# whether the other needs it too.
CONFIG_PIGEON_MQTT_AUTH_CERT=y

CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# The CA ships as PEM; without this mbedTLS accepts only DER.
CONFIG_MBEDTLS_PEM_PARSE_C=y
# Without SNI the server_name extension is never emitted whatever the hostname
# is set to, and Zephyr's TLS socket layer then refuses the hostname option
# outright rather than skipping it.
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
# The public chain is a P-256 leaf under an ECDSA intermediate anchored at
# ISRG Root X2, which is P-384/SHA-384; both curves and both hashes verify one
# chain. A development CA is P-256 throughout, but a build that only worked
# against that would prove less.
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
# ECDHE generates a fresh key pair per handshake, a separate PSA want.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# TLS 1.2 derives the master secret with its own PSA algorithm.
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
