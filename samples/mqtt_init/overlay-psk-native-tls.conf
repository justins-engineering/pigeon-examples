# TLS-PSK on a board whose board conf selects certificate mode.
#
# Both want lists are compiled in on the mbedTLS boards, so this only picks
# which one the session uses.
CONFIG_PIGEON_MQTT_AUTH_PSK=y
# The broker's third PSK suite is AES-128-CBC; the shared fragment covers the
# other two.
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
