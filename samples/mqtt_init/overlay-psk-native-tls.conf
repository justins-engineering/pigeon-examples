# TLS-PSK on a board whose TLS runs in Zephyr's own mbedTLS and whose board
# conf selects certificate mode -- boards/esp32c6_devkitc_hpcore.conf, which
# demonstrates the certificate path by default:
#
#   west build -b esp32c6_devkitc/esp32c6/hpcore samples/mqtt_init -- \
#     -DEXTRA_CONF_FILE=overlay-psk-native-tls.conf
#
# boards/native_sim_native_64.conf carries the same want-list inline, with
# the same per-item reasoning, because a Zephyr .conf cannot include another
# one -- so this is a copy on purpose rather than shared configuration. If
# one of them gains an item, check whether the other needs it too.
CONFIG_PIGEON_MQTT_AUTH_PSK=y

# Deliberately NOT a CONFIG_MBEDTLS_CIPHERSUITE_* pin: with no explicit
# ciphersuite list configured, mbedTLS offers every suite the enabled key
# exchange plus the PSA wants below allow, which covers all three suites the
# broker offers and lets its server-preference order decide.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# The PSK itself is imported into PSA as a PSA_KEY_TYPE_DERIVE key run
# through the TLS 1.2 PRF (HMAC-SHA256) -- without every want below,
# mbedtls_ssl_conf_psk()'s psa_import_key() fails and the handshake dies
# before a single byte leaves the device.
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
