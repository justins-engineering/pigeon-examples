# esp32c6_devkitc/Kconfig.sysbuild defaults BOOTLOADER to MCUBOOT (Espressif
# boards override the generic BOOTLOADER_NONE default -- unlike the nRF9160
# boards where MCUboot is opt-in). Turning this on under the NCS `nrf`
# project manifest is broken for a non-Nordic SoC: the `nrf` project
# (sdk-nrf) pulls in nrf/CMakeLists.txt unconditionally for every sysbuild
# image, including the MCUboot child image, and nrfxlib/common.cmake hard-
# asserts trying to resolve a Nordic-only crypto lib path for an SoC
# (esp32c6) nrfxlib has never heard of. Building this sample against
# samples/west-vanilla.yml (no `nrf` project at all) avoids that specific
# assert -- but the override stays regardless, because a bootloader-less
# single image is what this sample is for: a transport reference anyone can
# build and flash without a signing key or a slot layout to match. A FOTA
# build wants the opposite and says so explicitly, by merging this sample's
# sysbuild-mcuboot.conf on top of this file (see fota.conf for the whole
# build line). Upstream Zephyr builds MCUboot's own esp32c6 port and the
# board's default partition table already has boot/slot0/slot1/storage, so
# that override needs no child-image config of its own; it does mean the
# resulting images are signed with MCUboot's default development key.
SB_CONFIG_BOOTLOADER_NONE=y
