# Sysbuild fragment that turns this sample's MCUboot image back on, the
# other half of fota.conf (see that file for the full build line). Overrides
# sysbuild.conf's SB_CONFIG_BOOTLOADER_NONE rather than replacing it, so the
# default build keeps booting with no bootloader.
#
# The board's own partition table already carries boot/slot0/slot1 plus a
# storage partition for the settings/NVS backend, and upstream Zephyr builds
# MCUboot's esp32c6 port, so nothing else is needed here. Images are signed
# with MCUboot's default development key, which is fine for a bench and is
# not fine for a fleet.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
