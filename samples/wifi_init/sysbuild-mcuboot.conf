# The other half of fota.conf: puts MCUboot back under this sample without
# changing what the default build does.
#
# The board's partition table already carries boot/slot0/slot1 and a storage
# partition for the settings backend, and upstream Zephyr builds MCUboot's
# ESP32-C6 port, so nothing else is needed here.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# The board defaults this choice to a hash with no signature at all. Which key
# signs the image is ../mcuboot-signing.cmake's business.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
