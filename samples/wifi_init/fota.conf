# Firmware updates for this sample, merged on top of prj.conf:
#
#   west build -p always --sysbuild -b esp32c6_devkitc/esp32c6/hpcore \
#     samples/wifi_init -- \
#     -DEXTRA_CONF_FILE=fota.conf -DSB_EXTRA_CONF_FILE=sysbuild-mcuboot.conf
#
# Both paths resolve against this directory, not the one west runs in. Kept out
# of prj.conf so the default build stays a single image with no bootloader: an
# image signed for a slot layout the board is not running is worse than no
# update path at all. sysbuild-mcuboot.conf is the other half.

# The write path into MCUboot's second slot. Download resume and the attempt
# budget persist through settings over NVS; without that backend both start
# over on every boot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_PIGEON_FOTA=y
CONFIG_PIGEON_FOTA_RESUME=y
# One shadow target is chased a bounded number of times, so an image that
# boot-loops cannot re-download itself forever. Writing the shadow anew
# advances target_version, which reopens the budget.
CONFIG_PIGEON_FOTA_ATTEMPT_BUDGET=y

# Compared byte for byte against the shadow's firmware.version and never read
# from MCUboot's image header, so it has to name whatever version this image is
# uploaded under. The placeholder announces itself the first time a shadow
# offers a real version.
CONFIG_PIGEON_FOTA_CURRENT_VERSION="0.0.0-unversioned"

# One TLS connection per Range chunk costs about nine seconds here; 32 KiB
# chunks fetch an 800 KiB image in about 25 of them.
CONFIG_PIGEON_FOTA_CHUNK_SIZE=32768

# A long download can still fail a WiFi-adapter allocation inside a fatal
# ESP_ERROR_CHECK; a reboot there resumes from the persisted offset.
CONFIG_PIGEON_REBOOT_ON_FATAL=y
