# FOTA build fragment for this sample, merged on top of prj.conf:
#
#   west build --sysbuild -b esp32c6_devkitc/esp32c6/hpcore samples/wifi_init -- \
#     -DEXTRA_CONF_FILE=fota.conf -DSB_EXTRA_CONF_FILE=sysbuild-mcuboot.conf
#
# Both paths are resolved relative to this directory, not to the working
# directory west was run from.
#
# Kept out of prj.conf so the sample's default build stays what it has always
# been, a bootloader-less single image: FOTA needs MCUboot underneath it, and
# an image signed for a slot layout the board is not running is worse than no
# FOTA at all. The sysbuild fragment named above is the other half.

# MCUboot secondary-slot write path (pigeon's CONFIG_PIGEON_FOTA depends on
# BOOTLOADER_MCUBOOT and IMG_MANAGER, and pulls the erase configuration in
# itself). The settings/NVS backend is what download resume and the attempt
# budget persist through; without it both silently fall back to starting over
# on every boot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_PIGEON_FOTA=y
CONFIG_PIGEON_FOTA_RESUME=y

# Bound how many times one shadow target may be chased, so a firmware image
# that downloads cleanly and then boot-loops cannot re-download itself on
# every poll forever. Recovery is an operator writing the shadow again with
# a changed target_config, which advances target_version and reopens the
# budget.
CONFIG_PIGEON_FOTA_ATTEMPT_BUDGET=y

# Compared byte for byte against the shadow's firmware.version, and never
# read from MCUboot's own image header, so it has to be bumped by hand (or
# by the build pipeline) to whatever version string this image is uploaded
# to the platform as. Left at a placeholder here on purpose: a build that
# forgets to set it announces itself the first time a shadow offers a real
# version.
CONFIG_PIGEON_FOTA_CURRENT_VERSION="0.0.0-unversioned"

# One TLS connection per Range chunk, and a handshake on this SoC costs
# roughly nine seconds, so the 2048-byte library default would spend an hour
# on an 800 KiB image. 32 KiB brings the same image down to about 25 chunks.
CONFIG_PIGEON_FOTA_CHUNK_SIZE=32768

# Mitigations for a real, unfixed defect, not a fix for it: a sustained
# download on this board eventually fails a WiFi-adapter allocation, and the
# failure surfaces inside Espressif's timer shim as an ESP_ERROR_CHECK on
# ESP_ERR_NO_MEM, which aborts. A larger general pool (the WiFi adapter
# allocates from it) and far fewer connections per image both buy time
# without addressing the allocation growth itself, and the fatal hook turns
# the remaining case from a board that halts until a human power-cycles it
# into one that reboots and resumes from its persisted offset. Whether the
# larger pool removes the failure or only outruns it is unsettled.
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_PIGEON_REBOOT_ON_FATAL=y
