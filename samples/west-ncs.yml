# nRF Connect SDK manifest, for the nRF9160 and nRF9151 Feathers only: their
# LTE bring-up needs nrf_modem, lte_lc, modem_key_mgmt and the TF-M targets.
#
# west.yml is the default. This manifest vendors a forked Zephyr, so it needs
# a topdir of its own.
manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      repo-path: sdk-nrf
      remote: ncs
      revision: v3.4.0
      import:
         name-allowlist:
          - cjson
          - cmsis
          - cmsis-dsp
          - cmsis-nn
          - cmsis_6
          - hal_nordic
          - libmodem
          - littlefs
          - mbedtls
          - mcuboot
          - nrf_hw_models
          - nrfxlib
          - oberon-psa-crypto
          - picolibc
          - qcbor
          - segger
          - tf-psa-crypto
          - tinycrypt
          - trusted-firmware-m
          - zcbor
          - zephyr

  # The pigeon library is not a west project: ../pigeon is a checkout that
  # common/app.cmake adds as an extra module.

  self:
    path: samples
