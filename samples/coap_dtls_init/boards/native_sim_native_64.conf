# Native Simulator offloaded sockets (NSOS), not the TAP/zeth ethernet
# driver -- same rationale and structure as coap_tcp_init's native_sim
# conf (no root/net-setup.sh needed; NSOS calls straight into the host's
# BSD socket API). CONNECTIVITY_SIM is what lets this sample's
# native_sim_connection_manager.c drive conn_mgr through
# NET_EVENT_L4_CONNECTED like a real interface would.
CONFIG_NETWORKING=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_POSIX_API=y

CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y

# DTLS over the offloaded UDP socket, in Zephyr's own mbedTLS (the nRF91
# board offloads all of this to the modem instead -- none of the mbedTLS
# options below apply there).
CONFIG_NET_SOCKETS_ENABLE_DTLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# TLS configuration. MBEDTLS_BUILTIN + SSL_PROTO_TLS1_2 are the direct
# dependencies of MBEDTLS_SSL_PROTO_DTLS (which NET_SOCKETS_ENABLE_DTLS
# above y-selects) -- without them the select trips this workspace's
# fatal-Kconfig-warning policy at configure time.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=7168

# RFC 9146 DTLS Connection ID support in mbedTLS -- without this,
# CONFIG_PIGEON_COAP_DTLS_CID's setsockopt fails (non-fatally, logged) and
# the session just doesn't survive address rebinds.
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y

# PSK key exchange. Deliberately NOT a CONFIG_MBEDTLS_CIPHERSUITE_* pin:
# with no explicit ciphersuite list configured, mbedTLS offers every suite
# the enabled key exchange + PSA wants below allow -- which includes the
# constrained-device target TLS_PSK_WITH_AES_128_CCM_8 (no per-suite
# Kconfig exists for it in this Zephyr tree) alongside the GCM/CBC PSK
# suites. The e2e verification pins the SERVER (libcoap) to CCM_8 to prove
# that specific suite negotiates -- see this repo's README.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# The PSK itself is imported into PSA as a PSA_KEY_TYPE_DERIVE key run
# through the TLS 1.2 PRF (HMAC-SHA256) -- without every want below,
# mbedtls_ssl_conf_psk()'s psa_import_key() fails and the handshake dies
# before a single byte leaves the device (mbedTLS -0x7F80
# "HW_ACCEL_FAILED", found by running THIS build against a real libcoap
# server, not by reading Kconfig). Sibling finding to wifi_init's
# TLS12_PRF/HMAC discovery (its prj.conf item on the ECDHE path).
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
