# ESP32-C6 flavor: no modem, no offloaded DTLS -- native mbedTLS runs the
# PSK handshake over the board's real WiFi radio. Unlike
# circuitdojo_feather_nrf9160_ns.conf there is no CONFIG_MODEM_KEY_MGMT
# branch: pigeon_coap_register_psk() falls through to tls_credential_add(),
# the same native path native_sim already exercises, so this file's job is
# just "give that native mbedTLS stack a working DTLS-PSK ciphersuite plus
# real WiFi/DNS underneath it" -- not a new credential path.

# WiFi station bring-up (src/net/wifi_connection_manager.c). CONFIG_WIFI=y
# pulls in WIFI_ESP32, which auto-selects NET_L2_WIFI_MGMT/MBEDTLS/
# PSA_CRYPTO -- no separate wpa_supplicant module needed.
CONFIG_WIFI=y

# Static credentials (no shell/settings-based provisioning). The SSID has a
# compile-time BUILD_ASSERT in wifi_mgmt.c requiring a non-empty string even
# before prj.local.conf's real value is merged in, so this can't be left
# unset in tracked source -- "changeme" fails loudly (auth/AP-not-found) if
# prj.local.conf is ever missing, same convention as CONFIG_PIGEON_ENDPOINT.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_TYPE_PSK=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="changeme"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="changeme"

# conn_mgr's L4 connected/disconnected events (wifi_connection_manager.c
# waits on these) need a bigger monitor thread stack than the tree default
# once WiFi/mbedTLS is in the callback chain underneath it.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2048

# This sample never opens a TCP/cert-based connection (CoAP-over-DTLS/UDP
# with a PSK ciphersuite has no certificate on either side), so IPv6's
# Duplicate Address Detection/MLD machinery on the real WiFi L2 is just
# unused surface, not a requirement -- disabled outright rather than
# fought with, matching ws_init/wifi_init's own choice for this radio.
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y

# ESP32-C6 runs Zephyr's native IP stack (no offloaded modem resolver), so
# getaddrinfo() needs a real resolver wired up or every lookup fails -2.
# Static public resolvers rather than CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS:
# a dns_resolve_reconfigure() failure while parsing a DHCP offer's DNS
# option makes the whole offer get rejected, so DHCP silently never
# completes (same finding as ws_init/wifi_init's own DNS note).
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="1.1.1.1"
CONFIG_DNS_SERVER2="8.8.8.8"
CONFIG_DNS_RESOLVER_MAX_SERVERS=2

# DTLS over the native socket stack (the nRF91 board offloads this to the
# modem instead -- none of the mbedTLS options below apply there). Carried
# over verbatim from this sample's own native_sim board conf, which already
# proved this exact PSK/DTLS want-list against a real libcoap-mbedTLS
# server: no cert parsing, no SNI, no ECDHE -- a plain PSK ciphersuite is a
# much smaller want-list than the HTTPS/WS samples' X.509 handshake.
CONFIG_NET_SOCKETS_ENABLE_DTLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

# MBEDTLS_MEMORY_BUFFER_ALLOC_C (compiled in unconditionally by this tree's
# tf-psa-crypto config) hard-redirects mbedtls_calloc()/free() to its own
# dedicated static buffer rather than Zephyr's general heap -- without
# CONFIG_MBEDTLS_ENABLE_HEAP that buffer is never wired up and every mbedTLS
# allocation fails outright (see ws_init's prj.conf for the full trace of
# this exact failure mode on this exact board). Size is native_sim's own
# proven number for this exact DTLS-PSK-only workload -- no X.509 parsing,
# no ECDHE ephemeral key generation, so it stays far below the 96KiB the
# HTTPS/WS samples' TLS1.2 + cert-chain handshake measured needing. Not
# independently re-measured against real ESP32-C6 hardware (32-bit, smaller
# pointer-bearing structures than native_sim's 64-bit host), so if anything
# this is a conservative reuse rather than a fresh number for this board.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000

# RFC 9146 DTLS Connection ID support in mbedTLS -- without this,
# CONFIG_PIGEON_COAP_DTLS_CID's setsockopt fails (non-fatally, logged) and
# the session just doesn't survive address rebinds. This wires up the
# device-side capability the (default-on) pigeon option asks for.
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y

# PSK key exchange. Deliberately not a CONFIG_MBEDTLS_CIPHERSUITE_* pin:
# with no explicit ciphersuite list, mbedTLS offers every suite the enabled
# key exchange + PSA wants below allow -- covering both
# TLS_PSK_WITH_AES_128_GCM_SHA256 and the constrained-device target
# TLS_PSK_WITH_AES_128_CCM_8 (no per-suite Kconfig exists for either in
# this Zephyr tree), matching what the platform's CoAP terminator offers.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# The PSK itself is imported into PSA as a PSA_KEY_TYPE_DERIVE key run
# through the TLS 1.2 PRF (HMAC-SHA256) -- without every want below,
# mbedtls_ssl_conf_psk()'s psa_import_key() fails and the handshake dies
# before a single byte leaves the device.
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y

# ESP32-C6's WiFi/mbedTLS/wpa_supplicant stack already eats a lot of flash;
# optimize for size rather than debug, same reasoning as this repo's other
# ESP32-C6 samples.
CONFIG_SIZE_OPTIMIZATIONS=y

# Purely for the WiFi driver's own RX buffers and Zephyr's net_buf/net_pkt
# pools -- mbedTLS draws from its own dedicated buffer above, not this pool
# (confirmed on this exact stack, see ws_init's prj.conf). Bumped as a
# reasoned hedge against the "esp32c6_wifi_adapter: memory allocation
# failed" reports other samples on this board hit under reconnect churn;
# ESP32-C6-DevKitC-1 has 512KB SRAM to spare.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
