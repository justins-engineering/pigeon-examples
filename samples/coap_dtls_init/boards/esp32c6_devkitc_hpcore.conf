# Beyond ../../common/boards/esp32c6.conf.

# DTLS over the board's own UDP socket, in mbedTLS. The Feathers offload all
# of this to the modem, so none of it appears in their board files.
CONFIG_NET_SOCKETS_ENABLE_DTLS=y
# Lets the session survive a NAT rebind without a re-handshake; without it
# pigeon's CID request fails and is logged rather than fatal.
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y

