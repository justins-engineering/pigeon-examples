# nRF91 hardware flavor: DTLS runs inside the modem (offloaded sockets),
# so none of the native_sim conf's mbedTLS options appear here -- the modem
# firmware owns the handshake, the PSK ciphersuites (including the
# TLS_PSK_WITH_AES_128_CCM_8 target), and DTLS Connection ID
# (NRF_SO_SEC_DTLS_CID, reached through the same Zephyr TLS_DTLS_CID
# sockopt pigeon sets on every board; requires mfw_nrf9160 v1.3.5+ -- on
# older firmware pigeon logs a warning and runs CID-less).
#
# CONFIG_MODEM_KEY_MGMT is the piece coap_tcp_init's board conf documents
# as missing there: it switches pigeon_coap.c's PSK registration from
# tls_credential_add() (invisible to the modem) to modem_key_mgmt_write()
# into the modem's real credential store (%CMNG types IDENTITY/PSK, hex-
# encoded secret), done eagerly at pigeon_init() time because the store
# only accepts writes while the modem is offline -- which is why this
# sample's main.c calls pigeon_init() BEFORE lte_connect().
CONFIG_MODEM_KEY_MGMT=y

# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Pigeon"

# Set LIBC
CONFIG_PICOLIBC=y

# PicolibC targets C17 and POSIX 2018 standards
CONFIG_STD_C17=y

# Enforce MISRA C standards
CONFIG_MISRA_SANE=y

# Enable FPU & FPU sharing
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Power Management
CONFIG_PM_DEVICE=y

# Compiler optimizations: this sample has no MCUboot/sysbuild partition
# rebalance (unlike https_init), so it lands in the SoC's default, small
# non-MCUboot nonsecure flash partition -- optimize for size, not debug.
CONFIG_SIZE_OPTIMIZATIONS=y

# Debugging
CONFIG_DEBUG=y
CONFIG_FAULT_DUMP=2

# Network Logging
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y

# Without this, connection_manager.c's lte_disconnect() calling
# conn_mgr_all_if_down() fully shuts down the modem library instead of just
# deactivating LTE, leaving lte_lc_power_off()'s subsequent CFUN=0 with no AT
# channel to succeed on -- see https_init's prj.conf for the full writeup;
# this sample shares the same connection_manager.c pattern.
CONFIG_NRF_MODEM_LIB_NET_IF_DOWN_DEFAULT_LTE_DISCONNECT=y

# Align the max FD entry to NRF_MODEM_MAX_SOCKET_COUNT(8) -- see https_init's
# board conf, same reasoning applies to any modem-offloaded socket use.
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_POLL_MAX=8

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Connection Manager and Connectivity layer
CONFIG_NRF_MODEM_LIB_NET_IF=y

# AT Host
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_AT_HOST_LIBRARY=y

# TF-M configurations
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# UART configuration (common)
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# UART configuration (nRF91 specific)
CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
