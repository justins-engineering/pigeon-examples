# Pigeon client library: fetches/reports the device shadow over CoAP-over-
# DTLS/UDP (pigeon's CONFIG_PIGEON_COAP_TRANSPORT_UDP -- RFC 7252
# confirmable exchanges on a long-lived PSK DTLS session, the primary CoAP
# transport for constrained battery/cellular devices; coap_tcp_init is the
# RFC 8323 TLS/TCP sibling). The endpoint names a real device identity, so
# it lives in the git-ignored prj.local.conf instead (auto-merged by
# CMakeLists.txt if present), e.g.:
# CONFIG_PIGEON_ENDPOINT="coaps://coap.pidgeiot.com/device/pigeons/<pigeon_id>"
# No CONFIG_PIGEON_TOKEN: the PSK handshake is the device's entire
# authentication on CoAP (identity = pigeon id, secret = the short key
# minted alongside the bearer token; both passed via pigeon_init()).
#
# Everything NCS/ARM-only lives in boards/circuitdojo_feather_nrf9160_ns.conf
# rather than here, so the native_sim build works under this workspace's
# default vanilla-Zephyr manifest.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_COAP=y
CONFIG_PIGEON_COAP_TRANSPORT_UDP=y
# RFC 9146 DTLS Connection ID: lets the DTLS session survive NAT rebinds/
# PSM sleeps without a re-handshake. Left at its pigeon-Kconfig default
# (on -- the platform's CoAP terminator negotiates CID server-side); see
# the option's help in pigeon's zephyr/Kconfig for the per-backend device
# support story.

# Reset Reason and Reboot (shadow.c's "reboot" shadow command uses sys_reboot())
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Deferred rather than immediate, which CONFIG_PIGEON_LOG_UPLOAD below
# requires in practice: its backend fills a ring buffer that the flush work
# item drains, which is lock-free only while a single thread does the
# filling. Deferred mode makes the log processing thread that sole
# producer; immediate mode runs the backend inline on whichever thread
# happened to log, so two of them can race inside the same buffer. That
# thread gets CPU because shadow_loop() sleeps between polls.
CONFIG_LOG_MODE_DEFERRED=y
# Formatting frames at INFO level with the WiFi/DTLS modules in the mix
# run wider than the 768-byte default; not measured on this board, so this
# is headroom rather than a fitted number.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Lets shadow.c's "log" field actually toggle logging at runtime via
# log_filter_set() -- see https_init's shadow.c note.
CONFIG_LOG_RUNTIME_FILTERING=y

# Ship this device's logs to the platform as Zephyr dictionary-encoded
# binary (GET /pigeons/<id>/logs serves them back to the dashboard), which
# over CoAP means an RFC 7959 Block1 sequence -- see pigeon's
# pigeon_coap.c. The console is unaffected and stays human-readable:
# dictionary encoding is per-backend, and only pigeon's backend uses it.
#
# Decoding a chunk needs THIS build's log_dictionary.json (written to
# build/zephyr/ because CONFIG_PIGEON_LOG_UPLOAD selects
# CONFIG_LOG_DICTIONARY_SUPPORT). A dictionary from a different build does
# not error, it silently decodes to plausible nonsense -- archive the
# dictionary alongside whatever binary got flashed.
CONFIG_PIGEON_LOG_UPLOAD=y
# Batch at half the buffer rather than pigeon's smaller defaults: this
# board has SRAM to spare and no per-byte cellular cost, and a batch
# several blocks long is what actually exercises the Block1 path.
CONFIG_PIGEON_LOG_UPLOAD_BUF_SIZE=4096
CONFIG_PIGEON_LOG_UPLOAD_BATCH_SIZE=2048

# Stack and heap configurations
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y

# TLS credential storage: on native-TLS boards pigeon registers the PSK
# identity/secret from pigeon_init()'s config via tls_credential_add()
# under CONFIG_PIGEON_COAP_SEC_TAG (default 1). On modem-offloaded nRF91
# boards the same credentials go into the modem's own store instead -- see
# boards/circuitdojo_feather_nrf9160_ns.conf's CONFIG_MODEM_KEY_MGMT note.
CONFIG_TLS_CREDENTIALS=y

# Net connection manager
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# Default (768-800B) overflowed running connection_manager.c's net_mgmt event
# callback on this thread's stack -- see https_init's prj.conf note (same
# TLS/logging-heavy callback chain).
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
