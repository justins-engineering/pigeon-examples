# Pigeon client library: fetches/reports the device shadow over CoAP-over-
# DTLS/UDP (pigeon's CONFIG_PIGEON_COAP_TRANSPORT_UDP -- RFC 7252
# confirmable exchanges on a long-lived PSK DTLS session, the primary CoAP
# transport for constrained battery/cellular devices; coap_tcp_init is the
# RFC 8323 TLS/TCP sibling). CONFIG_PIGEON_ENDPOINT/TOKEN are real device
# secrets, so they live in the git-ignored prj.local.conf instead
# (auto-merged by CMakeLists.txt if present), e.g.:
# CONFIG_PIGEON_ENDPOINT="coaps://api.pidgeiot.com/device/pigeons/demo-pigeon-0003"
# CONFIG_PIGEON_TOKEN="replace-with-device-token"
#
# The real dovecote backend has no CoAP listener deployed yet (the
# terminator is a tracked roadmap item) -- this sample's protocol
# conformance is verified against libcoap's coap-server (DTLS-PSK) instead;
# see this repo's README. Unlike coap_tcp_init's prj.conf, everything
# NCS/ARM-only lives in boards/circuitdojo_feather_nrf9160_ns.conf rather
# than here, so the native_sim build works under this workspace's default
# vanilla-Zephyr manifest (same treatment task #54 gave https_init).
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_COAP=y
CONFIG_PIGEON_COAP_TRANSPORT_UDP=y
# RFC 9146 DTLS Connection ID (default y; listed explicitly for
# discoverability): lets the DTLS session survive NAT rebinds/PSM sleeps
# without a re-handshake wherever the stack underneath supports it -- see
# the option's help in pigeon's zephyr/Kconfig for the per-backend matrix.
CONFIG_PIGEON_COAP_DTLS_CID=y

# Reset Reason and Reboot (shadow.c's "reboot" shadow command uses sys_reboot())
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# Lets shadow.c's "log" field actually toggle logging at runtime via
# log_filter_set() -- see https_init's shadow.c note.
CONFIG_LOG_RUNTIME_FILTERING=y

# Stack and heap configurations
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y

# TLS credential storage: on native-TLS boards pigeon_coap.c registers the
# PSK identity/secret from pigeon_init()'s config via tls_credential_add()
# under CONFIG_PIGEON_COAP_SEC_TAG (default 1). On modem-offloaded nRF91
# boards the same credentials go into the modem's own store instead -- see
# boards/circuitdojo_feather_nrf9160_ns.conf's CONFIG_MODEM_KEY_MGMT note.
CONFIG_TLS_CREDENTIALS=y

# Net connection manager
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# Default (768-800B) overflowed running connection_manager.c's net_mgmt event
# callback on this thread's stack -- see https_init's prj.conf note (same
# TLS/logging-heavy callback chain).
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
