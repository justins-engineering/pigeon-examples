# esp32c6_devkitc/Kconfig.sysbuild defaults BOOTLOADER to MCUBOOT (Espressif
# boards override the generic BOOTLOADER_NONE default -- unlike the nRF9160
# boards this sample also targets, where MCUboot stays opt-in and this line
# is a no-op). This sample has no sysbuild/mcuboot child-image config or
# signing key wired up (no CONFIG_PIGEON_FOTA here), so there is nothing for
# SB_CONFIG_BOOTLOADER_MCUBOOT to actually build against on ESP32-C6 --
# same override, same reasoning, as this repo's ws_init/wifi_init samples.
SB_CONFIG_BOOTLOADER_NONE=y
